name: KEPHIR 2 EXP-97M Rapid Competitor Benchmark

on:
  workflow_dispatch:
  push:
    branches:
      - development/kephir-2-core
    paths:
      - "research/benchmarks/exp97_mini.py"
      - ".github/workflows/exp97_mini.yml"

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Install compressors
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake python3 unzip curl             zstd xz-utils gzip lz4
      - name: Build KEPHIR
        run: |
          cmake -S src/kephir2 -B build/kephir2 -DCMAKE_BUILD_TYPE=Release
          cmake --build build/kephir2 --config Release --parallel
      - name: Download Silesia
        run: |
          mkdir -p corpora/silesia
          curl -L --fail --retry 4 -o /tmp/silesia.zip             https://sun.aei.polsl.pl/~sdeor/corpus/silesia.zip
          echo "c240c17d6805fb8a0bde763f1b94cd99  /tmp/silesia.zip" | md5sum -c -
          unzip -q /tmp/silesia.zip -d corpora/silesia
      - name: Run EXP-97M
        run: |
          python3 research/benchmarks/exp97_mini.py             build/kephir2/kephir2_native_k75_cli
      - uses: actions/upload-artifact@v4
        with:
          name: exp97m-rapid-results
          path: exp97_mini_results.json
