name: KHEPRI Stream KS-03 Real Audio

on:
  workflow_dispatch:
  push:
    branches:
      - "research/khepri-stream-codec"
    paths:
      - "streaming/ks03_real_audio_bench.py"
      - "streaming/kstream_pcm_frontend.py"
      - "streaming/kstream_kmrl_frontend.py"
      - ".github/workflows/khepri_stream_ks03.yml"

jobs:
  audio:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential flac ffmpeg curl

      - name: Build EXP-33H backend
        run: |
          cat source_parts/src_gz_*.b64 | base64 -d | gunzip > KEPHIR_2_EXP23_BASE.cpp
          python3 make_exp26_source.py
          python3 make_exp27_source.py
          python3 make_exp31_source.py
          python3 make_exp33_source.py
          g++ -O3 -std=c++20 -DNDEBUG -DNO_INTERNAL_VERIFY             -DK2_ADAPT_MODE=9 -DK2_LAZY_MODE=1 -DK2_PSG_MODE=3 -DK2_DIST_TOPO_MODE=8             -pthread KEPHIR_2_EXP33_DISTANCE_TOPOLOGY.cpp -o kephir33

      - name: Acquire public Xiph test audio
        run: |
          curl -L --fail --retry 4             -o streaming/sintel_trailer_source.flac             https://media.xiph.org/sintel/sintel_trailer-audio.flac
          sha256sum streaming/sintel_trailer_source.flac

      - name: Derive benchmark PCM
        run: |
          ffmpeg -hide_banner -loglevel error -y             -i streaming/sintel_trailer_source.flac             -ac 2 -ar 48000 -sample_fmt s16 -f s16le             streaming/ks03_source_s16le_stereo_48k.raw
          sha256sum streaming/ks03_source_s16le_stereo_48k.raw
          stat -c '%s bytes' streaming/ks03_source_s16le_stereo_48k.raw

      - name: Run KS-03
        run: |
          python3 streaming/ks03_real_audio_bench.py             --raw streaming/ks03_source_s16le_stereo_48k.raw             --kephir ./kephir33

      - uses: actions/upload-artifact@v4
        with:
          name: khepri-stream-ks03
          path: streaming/ks03_out/ks03_results.json
