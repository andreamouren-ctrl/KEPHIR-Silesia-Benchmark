name: AURORA FAST-D Media Early Exit Matrix

on:
  workflow_dispatch:
  push:
    branches: ["research/khepri-stream-codec"]
    paths:
      - "make_fastd_media_source.py"
      - ".github/workflows/aurora_fastd_media_early_matrix.yml"

jobs:
  matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: baseline, early: 0 }
          - { name: conservative, early: 1 }
          - { name: balanced, early: 2 }
          - { name: aggressive, early: 3 }
    steps:
      - uses: actions/checkout@v4
      - name: Install
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential
      - name: Generate
        run: |
          cat source_parts/src_gz_*.b64 | base64 -d | gunzip > KEPHIR_2_EXP23_BASE.cpp
          python3 make_exp26_source.py
          python3 make_exp27_source.py
          python3 make_exp31_source.py
          python3 make_exp33_source.py
          python3 make_exp37_source.py
          python3 make_exp38_source.py
          python3 make_exp39_source.py
          K2_CHAIN_DEPTH_VALUE=24 K2_LAZY_DEPTH_VALUE=12 K2_PRED_MASK_VALUE=255 python3 make_speed1_source.py
          python3 make_fastd_source.py
          K2_MEDIA_EARLY_MODE=${{ matrix.early }} python3 make_fastd_media_source.py
          cp KEPHIR_SPEED_MEDIA_SOURCE.cpp KEPHIR_SPEED_D_SOURCE.cpp
      - name: Build
        run: |
          g++ -O3 -std=c++20 -DNDEBUG -DNO_INTERNAL_VERIFY -DAURORA_USE_FASTD             -DK2_ADAPT_MODE=9 -DK2_LAZY_MODE=0 -DK2_PSG_MODE=0             -DK2_DIST_TOPO_MODE=0 -DK2_DUAL_MATCH_MODE=0             -DK2_FUSED_MATCH_MODE=0 -DK2_FUSED2_MODE=0 -pthread             src/cpp/aurora_media/AuroraKhepriFastDMemoryAdapter.cpp             src/cpp/aurora_media/AuroraVideoMotion.cpp             src/cpp/aurora_media/AuroraVideoResidual.cpp             benchmarks/major_codecs/aurora_video_fastd_compare.cpp             -Isrc/cpp/aurora_media -o media_fastd_early
      - name: Run
        run: |
          echo "variant=${{ matrix.name }} early=${{ matrix.early }}" | tee result.txt
          ./media_fastd_early | tee -a result.txt
      - uses: actions/upload-artifact@v4
        with:
          name: fastd-early-${{ matrix.name }}
          path: result.txt
