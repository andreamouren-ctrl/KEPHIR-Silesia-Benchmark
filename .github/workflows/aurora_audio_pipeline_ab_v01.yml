name: AURORA Audio Pipeline A-B v0.1
on:
  workflow_dispatch:
  push:
    branches:
      - research/khepri-stream-codec
    paths:
      - benchmarks/major_codecs/benchmark_audio_pipeline_ab_v01.py
      - research/audio/lab/kstream_kmrl_frontend.py
      - src/python/reference/aurora_media_codec_bridge.py
      - .github/workflows/aurora_audio_pipeline_ab_v01.yml

jobs:
  audio-ab:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Build KHEPRI EXP-37A
        run: |
          cat source_parts/src_gz_*.b64 | base64 -d | gunzip > KEPHIR_2_EXP23_BASE.cpp
          python3 make_exp26_source.py
          python3 make_exp27_source.py
          python3 make_exp31_source.py
          python3 make_exp33_source.py
          python3 make_exp37_source.py
          g++ -O3 -std=c++20 -DNDEBUG -DNO_INTERNAL_VERIFY \
            -DK2_ADAPT_MODE=9 -DK2_LAZY_MODE=1 -DK2_PSG_MODE=3 -DK2_DIST_TOPO_MODE=8 \
            -DK2_DUAL_MATCH_MODE=1 -pthread KEPHIR_2_EXP37_DUAL_MATCH.cpp -o kephir37
      - name: Download real audio corpus sample
        run: |
          curl -L --fail --retry 4 -o sintel_audio.flac https://media.xiph.org/sintel/sintel_trailer-audio.flac
          ffmpeg -hide_banner -loglevel error -y -i sintel_audio.flac -ac 2 -ar 48000 -sample_fmt s16 -f s16le sintel_audio.raw
      - name: Run pipeline A-B
        env:
          PYTHONPATH: research/audio/lab:research/audio/experiments
        run: |
          python3 benchmarks/major_codecs/benchmark_audio_pipeline_ab_v01.py \
            --audio sintel_audio.raw --kephir ./kephir37 | tee audio_ab.txt
      - name: Validate
        run: |
          grep "AUDIO_PIPELINE_AB_PASS rows=5" audio_ab.txt
      - uses: actions/upload-artifact@v4
        with:
          name: aurora-audio-pipeline-ab-v01
          path: |
            audio_ab.txt
            results/benchmarks/audio_pipeline_ab_v01/results.json
