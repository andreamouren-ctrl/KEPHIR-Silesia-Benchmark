name: KEPHIR EXP-30A Validation
on:
  workflow_dispatch:
  push:
    paths:
      - "exp30a_validate.py"
      - ".github/workflows/exp30a_validate.yml"
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential unzip
      - name: Build EXP-30A
        run: |
          cat source_parts/src_gz_*.b64 | base64 -d | gunzip > KEPHIR_2_EXP23_BASE.cpp
          python3 make_exp26_source.py
          python3 make_exp27_source.py
          python3 make_exp30_source.py
          g++ -O3 -std=c++20 -DNDEBUG -DNO_INTERNAL_VERIFY -DK2_ADAPT_MODE=9 -DK2_LAZY_MODE=1 -DK2_POC_MODE=1 -pthread KEPHIR_2_EXP30_POC.cpp -o kephir30
      - name: Silesia
        run: |
          curl -L --fail --retry 4 -o silesia.zip https://sun.aei.polsl.pl/~sdeor/corpus/silesia.zip
          echo "c240c17d6805fb8a0bde763f1b94cd99  silesia.zip" | md5sum -c -
          mkdir silesia
          unzip -q silesia.zip -d silesia
      - name: Validate
        run: python3 exp30a_validate.py
      - uses: actions/upload-artifact@v4
        with:
          name: exp30a-validation
          path: exp30a_validation.json
