name: KHEPRI Stream KS-07B EXP37 Direct

on:
  workflow_dispatch:

jobs:
  ks07b:
    env:
      PYTHONPATH: research/audio/lab:research/audio/experiments:research/backend
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential ffmpeg curl
      - name: Build EXP-33H and EXP-37A
        run: |
          cat engine/khepri/source_parts/src_gz_*.b64 | base64 -d | gunzip > KEPHIR_2_EXP23_BASE.cpp
          python3 engine/khepri/generators/make_exp26_source.py
          python3 engine/khepri/generators/make_exp27_source.py
          python3 engine/khepri/generators/make_exp31_source.py
          python3 engine/khepri/generators/make_exp33_source.py
          g++ -O3 -std=c++20 -DNDEBUG -DNO_INTERNAL_VERIFY             -DK2_ADAPT_MODE=9 -DK2_LAZY_MODE=1 -DK2_PSG_MODE=3 -DK2_DIST_TOPO_MODE=8             -pthread KEPHIR_2_EXP33_DISTANCE_TOPOLOGY.cpp -o kephir33
          python3 engine/khepri/generators/make_exp37_source.py
          g++ -O3 -std=c++20 -DNDEBUG -DNO_INTERNAL_VERIFY             -DK2_ADAPT_MODE=9 -DK2_LAZY_MODE=1 -DK2_PSG_MODE=3 -DK2_DIST_TOPO_MODE=8             -DK2_DUAL_MATCH_MODE=1 -pthread KEPHIR_2_EXP37_DUAL_MATCH.cpp -o kephir37
      - name: Prepare PCM
        run: |
          curl -L --fail --retry 4             -o /tmp/sintel_trailer_source.flac             https://media.xiph.org/sintel/sintel_trailer-audio.flac
          ffmpeg -hide_banner -loglevel error -y             -i /tmp/sintel_trailer_source.flac             -ac 2 -ar 48000 -sample_fmt s16 -f s16le             /tmp/ks07b_source.raw
      - name: Run KS-07B
        run: |
          python3 research/audio/experiments/ks07b_exp37_direct.py             --raw /tmp/ks07b_source.raw             --exp33 ./kephir33             --exp37 ./kephir37
      - uses: actions/upload-artifact@v4
        with:
          name: khepri-stream-ks07b
          path: streaming/ks07b_out/ks07b_results.json
