name: KHEPRI Stream KS-07B EXP37 Direct

on:
  workflow_dispatch:
  push:
    branches:
      - "research/khepri-stream-codec"
    paths:
      - "streaming/ks07b_exp37_direct_bench.py"
      - "streaming/ks06_plane_sparsity_bench.py"
      - "streaming/kstream_kmrl_lab.py"
      - "make_exp37_source.py"
      - ".github/workflows/khepri_stream_ks07b.yml"

jobs:
  ks07b:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential ffmpeg curl
      - name: Build EXP-33H and EXP-37A
        run: |
          cat source_parts/src_gz_*.b64 | base64 -d | gunzip > KEPHIR_2_EXP23_BASE.cpp
          python3 make_exp26_source.py
          python3 make_exp27_source.py
          python3 make_exp31_source.py
          python3 make_exp33_source.py
          g++ -O3 -std=c++20 -DNDEBUG -DNO_INTERNAL_VERIFY             -DK2_ADAPT_MODE=9 -DK2_LAZY_MODE=1 -DK2_PSG_MODE=3 -DK2_DIST_TOPO_MODE=8             -pthread KEPHIR_2_EXP33_DISTANCE_TOPOLOGY.cpp -o kephir33
          python3 make_exp37_source.py
          g++ -O3 -std=c++20 -DNDEBUG -DNO_INTERNAL_VERIFY             -DK2_ADAPT_MODE=9 -DK2_LAZY_MODE=1 -DK2_PSG_MODE=3 -DK2_DIST_TOPO_MODE=8             -DK2_DUAL_MATCH_MODE=1 -pthread KEPHIR_2_EXP37_DUAL_MATCH.cpp -o kephir37
      - name: Prepare PCM
        run: |
          curl -L --fail --retry 4             -o streaming/sintel_trailer_source.flac             https://media.xiph.org/sintel/sintel_trailer-audio.flac
          ffmpeg -hide_banner -loglevel error -y             -i streaming/sintel_trailer_source.flac             -ac 2 -ar 48000 -sample_fmt s16 -f s16le             streaming/ks07b_source.raw
      - name: Run KS-07B
        run: |
          python3 streaming/ks07b_exp37_direct_bench.py             --raw streaming/ks07b_source.raw             --exp33 ./kephir33             --exp37 ./kephir37
      - uses: actions/upload-artifact@v4
        with:
          name: khepri-stream-ks07b
          path: streaming/ks07b_out/ks07b_results.json
