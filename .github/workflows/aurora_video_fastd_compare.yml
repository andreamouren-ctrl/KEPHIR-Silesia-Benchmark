name: AURORA Video KHEPRI Fast-D Benchmark

on:
  workflow_dispatch:
  push:
    branches: ["research/khepri-stream-codec"]
    paths:
      - "make_exp38_source.py"
      - "make_exp39_source.py"
      - "make_speed1_source.py"
      - "make_fastd_source.py"
      - "src/cpp/aurora_media/AuroraKhepriFastDMemoryAdapter.*"
      - "benchmarks/major_codecs/aurora_video_fastd_compare.cpp"
      - ".github/workflows/aurora_video_fastd_compare.yml"

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Install
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential
      - name: Generate EXP-37A and FAST-D sources
        run: |
          cat source_parts/src_gz_*.b64 | base64 -d | gunzip > KEPHIR_2_EXP23_BASE.cpp
          python3 make_exp26_source.py
          python3 make_exp27_source.py
          python3 make_exp31_source.py
          python3 make_exp33_source.py
          python3 make_exp37_source.py
          python3 make_exp38_source.py
          python3 make_exp39_source.py
          K2_CHAIN_DEPTH_VALUE=24 K2_LAZY_DEPTH_VALUE=12 K2_PRED_MASK_VALUE=255 python3 make_speed1_source.py
          python3 make_fastd_source.py
      - name: Build EXP-37A media benchmark
        run: |
          g++ -O3 -std=c++20 -DNDEBUG -DNO_INTERNAL_VERIFY \
            -DK2_ADAPT_MODE=9 -DK2_LAZY_MODE=1 -DK2_PSG_MODE=3 \
            -DK2_DIST_TOPO_MODE=8 -DK2_DUAL_MATCH_MODE=1 -pthread \
            src/cpp/aurora_media/AuroraKhepriExp37MemoryAdapter.cpp \
            src/cpp/aurora_media/AuroraVideoMotion.cpp \
            src/cpp/aurora_media/AuroraVideoResidual.cpp \
            benchmarks/major_codecs/aurora_video_fastd_compare.cpp \
            -Isrc/cpp/aurora_media -o media_exp37
      - name: Build FAST-D media benchmark
        run: |
          g++ -O3 -std=c++20 -DNDEBUG -DNO_INTERNAL_VERIFY -DAURORA_USE_FASTD \
            -DK2_ADAPT_MODE=9 -DK2_LAZY_MODE=0 -DK2_PSG_MODE=0 \
            -DK2_DIST_TOPO_MODE=0 -DK2_DUAL_MATCH_MODE=0 \
            -DK2_FUSED_MATCH_MODE=0 -DK2_FUSED2_MODE=0 -pthread \
            src/cpp/aurora_media/AuroraKhepriFastDMemoryAdapter.cpp \
            src/cpp/aurora_media/AuroraVideoMotion.cpp \
            src/cpp/aurora_media/AuroraVideoResidual.cpp \
            benchmarks/major_codecs/aurora_video_fastd_compare.cpp \
            -Isrc/cpp/aurora_media -o media_fastd
      - name: Run backend comparison
        run: |
          ./media_exp37 | tee media_exp37.txt
          ./media_fastd | tee media_fastd.txt
          cat media_exp37.txt media_fastd.txt > media_fastd_compare.txt
      - uses: actions/upload-artifact@v4
        with:
          name: aurora-video-fastd-compare
          path: media_fastd_compare.txt
