name: AURORA SAD Row-Pair SSE2

on:
  workflow_dispatch:
  pull_request:
    branches: ["research/khepri-stream-codec"]
  push:
    branches: ["feature/aurora-media-sad-rowpair-sse2"]
    paths:
      - ".github/workflows/aurora_sad_rowpair_sse2.yml"
      - "src/cpp/aurora_media/AuroraVideoMotion.cpp"
      - "benchmarks/major_codecs/aurora_exact_motion_fastpath.cpp"
      - "tests/cpp/test_aurora_video_motion.cpp"

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Build regression test
        run: |
          g++ -O3 -march=native -mtune=native -std=c++20 -DNDEBUG \
            -Wall -Wextra -Werror \
            src/cpp/aurora_media/AuroraVideoMotion.cpp \
            src/cpp/aurora_media/AuroraVideoResidual.cpp \
            tests/cpp/test_aurora_video_motion.cpp \
            -Isrc/cpp/aurora_media \
            -o test_motion

      - name: Run regression test
        run: ./test_motion | tee regression.txt

      - name: Build single-row baseline
        run: |
          g++ -O3 -march=native -mtune=native -std=c++20 -DNDEBUG \
            -DAURORA_DISABLE_SAD_ROWPAIR \
            -Wall -Wextra -Werror \
            src/cpp/aurora_media/AuroraVideoMotion.cpp \
            benchmarks/major_codecs/aurora_exact_motion_fastpath.cpp \
            -Isrc/cpp/aurora_media \
            -o bench_single

      - name: Build row-pair SSE2
        run: |
          g++ -O3 -march=native -mtune=native -std=c++20 -DNDEBUG \
            -Wall -Wextra -Werror \
            src/cpp/aurora_media/AuroraVideoMotion.cpp \
            benchmarks/major_codecs/aurora_exact_motion_fastpath.cpp \
            -Isrc/cpp/aurora_media \
            -o bench_pair

      - name: Run A/B benchmark
        run: |
          echo "=== SINGLE ===" | tee sad_rowpair_ab.txt
          ./bench_single | tee -a sad_rowpair_ab.txt
          echo "=== PAIR ===" | tee -a sad_rowpair_ab.txt
          ./bench_pair | tee -a sad_rowpair_ab.txt

      - name: Validate equivalence and summarize
        run: |
          python3 - <<'PY' | tee sad_rowpair_summary.txt
          import re
          from pathlib import Path

          text = Path("sad_rowpair_ab.txt").read_text()
          parts = text.split("=== PAIR ===")
          if len(parts) != 2:
              raise SystemExit("missing A/B sections")

          def parse(section):
              rows={}
              for line in section.splitlines():
                  if not line.startswith("MOTION_BENCH "):
                      continue
                  vals=dict(re.findall(r"(\w+)=([^ ]+)", line))
                  rows[vals["name"]]=vals
              return rows

          base=parse(parts[0])
          fast=parse(parts[1])
          if base.keys()!=fast.keys():
              raise SystemExit("scenario mismatch")

          print("AURORA_SAD_ROWPAIR_SSE2_AB")
          for name in sorted(base):
              b,f=base[name],fast[name]
              for key in ("fingerprint","motion_bytes","residual_bytes"):
                  if b[key]!=f[key]:
                      raise SystemExit(f"{name}: output mismatch in {key}")
              b_ms=float(b["ms"])
              f_ms=float(f["ms"])
              speed=b_ms/f_ms if f_ms else 0.0
              saving=(1.0-f_ms/b_ms)*100.0 if b_ms else 0.0
              print(
                  f"{name}: single_ms={b_ms:.6f} pair_ms={f_ms:.6f} "
                  f"speedup_x={speed:.3f} time_reduction_pct={saving:.2f}"
              )
          print("BITSTREAM_EQUIVALENCE=PASS")
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: aurora-sad-rowpair-sse2
          path: |
            regression.txt
            sad_rowpair_ab.txt
            sad_rowpair_summary.txt
