name: AURORA Video Depth Profiles Multi-Resolution

on:
  workflow_dispatch:
  push:
    branches: ["research/khepri-stream-codec"]
    paths:
      - "benchmarks/major_codecs/aurora_video_depth_profiles_multires.cpp"
      - ".github/workflows/aurora_video_depth_profiles_multires.yml"

jobs:
  multires:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Install
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential
      - name: Generate base chain
        run: |
          cat source_parts/src_gz_*.b64 | base64 -d | gunzip > KEPHIR_2_EXP23_BASE.cpp
          python3 make_exp26_source.py
          python3 make_exp27_source.py
          python3 make_exp31_source.py
          python3 make_exp33_source.py
          python3 make_exp37_source.py
          python3 make_exp38_source.py
          python3 make_exp39_source.py
      - name: Build FAST BALANCED RATIO
        run: |
          common="-O3 -std=c++20 -DNDEBUG -DNO_INTERNAL_VERIFY -DK2_ADAPT_MODE=9 -DK2_LAZY_MODE=0 -DK2_PSG_MODE=0 -DK2_DIST_TOPO_MODE=0 -DK2_DUAL_MATCH_MODE=0 -DK2_FUSED_MATCH_MODE=0 -DK2_FUSED2_MODE=0 -pthread -Isrc/cpp/aurora_media"
          src="src/cpp/aurora_media/AuroraKhepriFastDMemoryAdapter.cpp src/cpp/aurora_media/AuroraVideoMotion.cpp src/cpp/aurora_media/AuroraVideoResidual.cpp benchmarks/major_codecs/aurora_video_depth_profiles_multires.cpp"
          for spec in "24 12 fast fast_24_12" "48 24 balanced fast_48_24" "64 32 ratio fast_64_32"; do
            set -- $spec
            K2_CHAIN_DEPTH_VALUE=$1 K2_LAZY_DEPTH_VALUE=$2 K2_PRED_MASK_VALUE=255 python3 make_speed1_source.py
            python3 make_fastd_source.py
            g++ $common $src -o $4
          done
      - name: Run all profiles and resolutions
        run: |
          set -o pipefail
          : > depth_multires_results.txt
          for spec in             "fast_24_12 fast 1920 1080"             "fast_24_12 fast 2560 1440"             "fast_24_12 fast 3840 2160"             "fast_48_24 balanced 1920 1080"             "fast_48_24 balanced 2560 1440"             "fast_48_24 balanced 3840 2160"             "fast_64_32 ratio 1920 1080"             "fast_64_32 ratio 2560 1440"             "fast_64_32 ratio 3840 2160"; do
              set -- $spec
              ./$1 $2 $3 $4 | tee -a depth_multires_results.txt
          done
      - name: Summarize
        run: |
          grep "DEPTH_MULTIRES_PASS" depth_multires_results.txt
      - uses: actions/upload-artifact@v4
        with:
          name: aurora-video-depth-profiles-multires
          path: depth_multires_results.txt
