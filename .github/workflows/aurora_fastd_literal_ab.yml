name: AURORA FAST-D Literal Path A-B
on:
  workflow_dispatch:
  push:
    branches: ["research/khepri-stream-codec"]
    paths:
      - "make_fastd_literal_variants.py"
      - "benchmarks/major_codecs/aurora_fastd_literal_ab.cpp"
      - ".github/workflows/aurora_fastd_literal_ab.yml"
jobs:
  literal-ab:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Install
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential
      - name: Generate common speed source
        run: |
          cat source_parts/src_gz_*.b64 | base64 -d | gunzip > KEPHIR_2_EXP23_BASE.cpp
          python3 make_exp26_source.py
          python3 make_exp27_source.py
          python3 make_exp31_source.py
          python3 make_exp33_source.py
          python3 make_exp37_source.py
          python3 make_exp38_source.py
          python3 make_exp39_source.py
          K2_CHAIN_DEPTH_VALUE=24 K2_LAZY_DEPTH_VALUE=12 K2_PRED_MASK_VALUE=255 python3 make_speed1_source.py
      - name: Build four literal variants
        run: |
          common="-O3 -std=c++20 -fPIC -shared -DNDEBUG -DNO_INTERNAL_VERIFY -DAURORA_PLUGIN_FASTD -DK2_ADAPT_MODE=9 -DK2_LAZY_MODE=0 -DK2_PSG_MODE=0 -DK2_DIST_TOPO_MODE=0 -DK2_DUAL_MATCH_MODE=0 -DK2_FUSED_MATCH_MODE=0 -DK2_FUSED2_MODE=0 -pthread -Isrc/cpp/aurora_media"
          src="src/cpp/aurora_media/AuroraKhepriFastDMemoryAdapter.cpp benchmarks/major_codecs/aurora_backend_plugin.cpp"
          for spec in "baseline liblit_base.so" "predictor_only liblit_pred.so" "model_only liblit_model.so" "full liblit_full.so"; do
            set -- $spec
            K2_FASTD_LITERAL_VARIANT=$1 python3 make_fastd_literal_variants.py
            g++ $common $src -o $2
          done
      - name: Build benchmark
        run: |
          g++ -O3 -std=c++20 -DNDEBUG -pthread             src/cpp/aurora_media/AuroraVideoMotion.cpp src/cpp/aurora_media/AuroraVideoResidual.cpp             benchmarks/major_codecs/aurora_fastd_literal_ab.cpp             -Isrc/cpp/aurora_media -ldl -o aurora_fastd_literal_ab
      - name: Run benchmark
        run: ./aurora_fastd_literal_ab | tee literal_ab_results.txt
      - uses: actions/upload-artifact@v4
        with:
          name: aurora-fastd-literal-ab
          path: literal_ab_results.txt
