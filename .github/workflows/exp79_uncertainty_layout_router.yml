name: KEPHIR 2 EXP-79 Uncertainty-Aware Router
on:
  push:
    branches:
      - development/kephir-2-core
    paths:
      - "research/packaging/exp79_uncertainty_layout_router.py"
      - "docs/architecture/KEPHIR_2_PRODUCT_PLAN.md"
      - ".github/workflows/exp79_uncertainty_layout_router.yml"
  workflow_dispatch:

jobs:
  exp79-uncertainty-router:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential unzip curl

      - name: Build KEPHIR production backend
        run: |
          cat engine/source_parts/src_gz_*.b64 | base64 -d | gunzip > KEPHIR_2_EXP23_BASE.cpp
          python3 research/generators/general/make_exp26_source.py
          python3 research/generators/general/make_exp27_source.py
          python3 research/generators/general/make_exp31_source.py
          python3 research/generators/general/make_exp33_source.py
          python3 research/generators/general/make_exp37_source.py
          g++ -O3 -std=c++20 -DNDEBUG -DNO_INTERNAL_VERIFY \
            -DK2_ADAPT_MODE=9 -DK2_LAZY_MODE=1 -DK2_PSG_MODE=3 \
            -DK2_DIST_TOPO_MODE=8 -DK2_DUAL_MATCH_MODE=1 \
            -pthread KEPHIR_2_EXP37_DUAL_MATCH.cpp -o kephir37

      - name: Download canonical Silesia
        run: |
          mkdir -p corpora/silesia
          curl -L --fail --retry 4 -o /tmp/silesia.zip https://sun.aei.polsl.pl/~sdeor/corpus/silesia.zip
          echo "c240c17d6805fb8a0bde763f1b94cd99  /tmp/silesia.zip" | md5sum -c -
          unzip -q /tmp/silesia.zip -d corpora/silesia
          test "$(find corpora/silesia -type f | wc -l)" -eq 12

      - name: Run EXP-79
        env:
          KEPHIR_WORKERS: "16"
        run: python3 research/packaging/exp79_uncertainty_layout_router.py

      - name: Validate and summarize
        run: |
          python3 - <<'PY'
          import json
          d=json.load(open("exp78_results.json"))
          for name,ds in d["datasets"].items():
              assert ds["full_smart"]["sha_ok"]
              assert ds["full_flat"]["sha_ok"]
              p=ds["probe"]
              print("DATASET",name)
              print("EXP77_SELECTED",ds["exp77_selected_layout"])
              print("PROBE_SELECTED",ds["probe_selected_layout"])
              print("ORACLE",ds["oracle_layout"])
              print("OLD_REGRET_BYTES",ds["exp77_regret_bytes"])
              print("NEW_REGRET_BYTES",ds["probe_regret_bytes"])
              print("REGRET_IMPROVEMENT_BYTES",ds["regret_improvement_bytes"])
              print("PROBE_REASON",p["reason"])
              print("PROBE_TIME_S",p["total_probe_time_s"])
              for i,s in enumerate(p["stages"],1):
                  print("STAGE",i,
                        "BUDGET",s["budget_bytes"],
                        "SAMPLED",s["sampled_bytes"],
                        "SELECTED",s["selected_layout"],
                        "MARGIN",s["relative_margin"],
                        "SMART",s["smart"]["archive_bytes"],
                        "FLAT",s["flat"]["archive_bytes"])
          print("AGGREGATE",json.dumps(d["aggregate"],sort_keys=True))
          print("EXP79_SHA_ALL_PASS")
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: exp79-uncertainty-router-results
          path: |
            exp78_results.json
            exp77_results.json
