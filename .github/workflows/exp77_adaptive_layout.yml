name: AURORA EXP-77 Adaptive Directory Layout
on:
  push:
    branches:
      - research/exp77-adaptive-layout
    paths:
      - "research/packaging/exp77_adaptive_layout.py"
      - ".github/workflows/exp77_adaptive_layout.yml"
  workflow_dispatch:

jobs:
  exp77-adaptive-layout:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential unzip curl

      - name: Build KEPHIR production backend
        run: |
          cat engine/source_parts/src_gz_*.b64 | base64 -d | gunzip > KEPHIR_2_EXP23_BASE.cpp
          python3 research/generators/general/make_exp26_source.py
          python3 research/generators/general/make_exp27_source.py
          python3 research/generators/general/make_exp31_source.py
          python3 research/generators/general/make_exp33_source.py
          python3 research/generators/general/make_exp37_source.py
          g++ -O3 -std=c++20 -DNDEBUG -DNO_INTERNAL_VERIFY \
            -DK2_ADAPT_MODE=9 -DK2_LAZY_MODE=1 -DK2_PSG_MODE=3 \
            -DK2_DIST_TOPO_MODE=8 -DK2_DUAL_MATCH_MODE=1 \
            -pthread KEPHIR_2_EXP37_DUAL_MATCH.cpp -o kephir37

      - name: Download canonical Silesia
        run: |
          mkdir -p corpora/silesia
          curl -L --fail --retry 4 -o /tmp/silesia.zip https://sun.aei.polsl.pl/~sdeor/corpus/silesia.zip
          echo "c240c17d6805fb8a0bde763f1b94cd99  /tmp/silesia.zip" | md5sum -c -
          unzip -q /tmp/silesia.zip -d corpora/silesia
          test "$(find corpora/silesia -type f | wc -l)" -eq 12

      - name: Run EXP-77
        env:
          KEPHIR_WORKERS: "16"
        run: python3 research/packaging/exp77_adaptive_layout.py

      - name: Validate and summarize
        run: |
          python3 - <<'PY'
          import json
          d=json.load(open("exp77_results.json"))
          for name,ds in d["datasets"].items():
              assert ds["smart"]["sha_ok"]
              assert ds["flat"]["sha_ok"]
              assert ds["adaptive"]["sha_ok"]
              print("DATASET",name)
              print("META",json.dumps(ds["meta"],sort_keys=True))
              print("SMART",ds["smart"]["archive_bytes"],ds["smart"]["ratio"],ds["smart"]["comp_time_s"])
              print("FLAT",ds["flat"]["archive_bytes"],ds["flat"]["ratio"],ds["flat"]["comp_time_s"])
              print("ADAPTIVE",ds["selected_layout"],ds["adaptive"]["archive_bytes"],ds["adaptive"]["ratio"])
              print("ORACLE",ds["oracle_layout"],"REGRET_BYTES",ds["selection_regret_bytes"])
              print("FLAT_MINUS_SMART_BYTES",ds["flat_minus_smart_bytes"])
          print("EXP77_SHA_ALL_PASS")
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: exp77-adaptive-layout-results
          path: exp77_results.json
