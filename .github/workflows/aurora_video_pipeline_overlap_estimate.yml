name: AURORA Video Pipeline Overlap Estimate
on:
  workflow_dispatch:
  push:
    branches: ["research/khepri-stream-codec"]
    paths:
      - "benchmarks/major_codecs/aurora_video_pipeline_overlap_estimate.cpp"
      - ".github/workflows/aurora_video_pipeline_overlap_estimate.yml"
jobs:
  overlap:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Install
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential
      - name: Generate FAST profile
        run: |
          cat source_parts/src_gz_*.b64 | base64 -d | gunzip > KEPHIR_2_EXP23_BASE.cpp
          python3 make_exp26_source.py
          python3 make_exp27_source.py
          python3 make_exp31_source.py
          python3 make_exp33_source.py
          python3 make_exp37_source.py
          python3 make_exp38_source.py
          python3 make_exp39_source.py
          python3 make_fastd_video_profile_source.py streaming4k
      - name: Build
        run: |
          g++ -O3 -std=c++20 -DNDEBUG -DNO_INTERNAL_VERIFY             -DK2_ADAPT_MODE=9 -DK2_LAZY_MODE=0 -DK2_PSG_MODE=0 -DK2_DIST_TOPO_MODE=0             -DK2_DUAL_MATCH_MODE=0 -DK2_FUSED_MATCH_MODE=0 -DK2_FUSED2_MODE=0 -pthread             src/cpp/aurora_media/AuroraKhepriFastDMemoryAdapter.cpp             src/cpp/aurora_media/AuroraVideoMotion.cpp src/cpp/aurora_media/AuroraVideoResidual.cpp             benchmarks/major_codecs/aurora_video_pipeline_overlap_estimate.cpp             -Isrc/cpp/aurora_media -o aurora_video_pipeline_overlap_estimate
      - name: Run
        run: |
          set -o pipefail
          ./aurora_video_pipeline_overlap_estimate | tee overlap_results.txt
      - name: Validate
        run: grep "OVERLAP_PASS" overlap_results.txt
      - uses: actions/upload-artifact@v4
        with:
          name: aurora-video-pipeline-overlap
          path: overlap_results.txt
