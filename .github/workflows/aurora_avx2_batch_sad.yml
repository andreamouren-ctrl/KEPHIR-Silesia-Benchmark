name: AURORA AVX2 Batch SAD

on:
  workflow_dispatch:
  pull_request:
    branches: ["research/khepri-stream-codec"]
  push:
    branches: ["feature/aurora-media-avx2-batch-sad"]
    paths:
      - ".github/workflows/aurora_avx2_batch_sad.yml"
      - "src/cpp/aurora_media/AuroraVideoMotion.cpp"
      - "src/cpp/aurora_media/AuroraVideoResidual.cpp"
      - "benchmarks/major_codecs/aurora_exact_motion_fastpath.cpp"
      - "tests/cpp/test_aurora_video_motion.cpp"

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Verify AVX2 availability
        run: |
          grep -q avx2 /proc/cpuinfo
          echo "AVX2_AVAILABLE"

      - name: Build regression test
        run: |
          g++ -O3 -march=native -mtune=native -std=c++20 -DNDEBUG \
            -Wall -Wextra -Werror \
            src/cpp/aurora_media/AuroraVideoMotion.cpp \
            src/cpp/aurora_media/AuroraVideoResidual.cpp \
            tests/cpp/test_aurora_video_motion.cpp \
            -Isrc/cpp/aurora_media \
            -o test_motion

      - name: Run regression test
        run: ./test_motion | tee regression.txt

      - name: Build SSE2/reference motion benchmark
        run: |
          g++ -O3 -march=native -mtune=native -std=c++20 -DNDEBUG \
            -DAURORA_DISABLE_AVX2_BATCH_SAD \
            -Wall -Wextra -Werror \
            src/cpp/aurora_media/AuroraVideoMotion.cpp \
            benchmarks/major_codecs/aurora_exact_motion_fastpath.cpp \
            -Isrc/cpp/aurora_media \
            -o bench_reference

      - name: Build AVX2 batch motion benchmark
        run: |
          g++ -O3 -march=native -mtune=native -std=c++20 -DNDEBUG \
            -Wall -Wextra -Werror \
            src/cpp/aurora_media/AuroraVideoMotion.cpp \
            benchmarks/major_codecs/aurora_exact_motion_fastpath.cpp \
            -Isrc/cpp/aurora_media \
            -o bench_avx2

      - name: Run A/B benchmark
        run: |
          echo "=== REFERENCE ===" | tee avx2_batch_sad_ab.txt
          ./bench_reference | tee -a avx2_batch_sad_ab.txt
          echo "=== AVX2 ===" | tee -a avx2_batch_sad_ab.txt
          ./bench_avx2 | tee -a avx2_batch_sad_ab.txt

      - name: Validate equivalence and summarize
        run: |
          python3 - <<'PY' | tee avx2_batch_sad_summary.txt
          import re
          from pathlib import Path

          text=Path("avx2_batch_sad_ab.txt").read_text()
          parts=text.split("=== AVX2 ===")
          if len(parts)!=2:
              raise SystemExit("missing A/B sections")

          def parse(section):
              rows={}
              for line in section.splitlines():
                  if not line.startswith("MOTION_BENCH "):
                      continue
                  vals=dict(re.findall(r"(\w+)=([^ ]+)",line))
                  rows[vals["name"]]=vals
              return rows

          base=parse(parts[0]); fast=parse(parts[1])
          if base.keys()!=fast.keys():
              raise SystemExit("scenario mismatch")

          print("AURORA_AVX2_BATCH_SAD_AB")
          for name in sorted(base):
              b,f=base[name],fast[name]
              for key in ("fingerprint","motion_bytes","residual_bytes"):
                  if b[key]!=f[key]:
                      raise SystemExit(f"{name}: output mismatch in {key}")
              bm=float(b["ms"]); fm=float(f["ms"])
              speed=bm/fm if fm else 0.0
              saving=(1.0-fm/bm)*100.0 if bm else 0.0
              print(
                  f"{name}: reference_ms={bm:.6f} avx2_ms={fm:.6f} "
                  f"speedup_x={speed:.3f} time_reduction_pct={saving:.2f}"
              )

          # Promotion requires a meaningful difficult-motion gain while
          # preserving exact output. Other cases are recorded, not hidden.
          noise_b=float(base["noise"]["ms"])
          noise_f=float(fast["noise"]["ms"])
          if noise_f >= noise_b*0.95:
              raise SystemExit(
                  f"AVX2 difficult-motion gain below 5%: {noise_b/noise_f:.3f}x"
              )
          print("BITSTREAM_EQUIVALENCE=PASS")
          print("HIGH_MOTION_PROMOTION_GATE=PASS")
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: aurora-avx2-batch-sad
          path: |
            regression.txt
            avx2_batch_sad_ab.txt
            avx2_batch_sad_summary.txt
