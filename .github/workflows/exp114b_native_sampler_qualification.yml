name: KEPHIR 2 EXP-114B Native Sampler Qualification

on:
  workflow_dispatch:
  push:
    branches:
      - research/exp114-sampler-geometry
    paths:
      - "src/kephir2/**"
      - "research/benchmarks/exp112_adaptive_context_router.py"
      - "research/benchmarks/exp113_native_context_router.py"
      - ".github/workflows/exp114b_native_sampler_qualification.yml"
  pull_request:
    branches:
      - research/exp113-native-context-router
    paths:
      - "src/kephir2/**"
      - "research/benchmarks/exp112_adaptive_context_router.py"
      - "research/benchmarks/exp113_native_context_router.py"
      - ".github/workflows/exp114b_native_sampler_qualification.yml"

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 300

    steps:
      - uses: actions/checkout@v4

      - name: Build native KEPHIR
        run: |
          cmake -S src/kephir2 -B build/kephir2 -DCMAKE_BUILD_TYPE=Release
          cmake --build build/kephir2 --config Release --parallel

      - name: Native test suite
        run: ctest --test-dir build/kephir2 --output-on-failure

      - name: Download canonical Silesia
        run: |
          mkdir -p corpora/silesia
          curl -L --fail --retry 4 -o /tmp/silesia.zip \
            https://sun.aei.polsl.pl/~sdeor/corpus/silesia.zip
          echo "c240c17d6805fb8a0bde763f1b94cd99  /tmp/silesia.zip" | md5sum -c -
          unzip -q /tmp/silesia.zip -d corpora/silesia
          test "$(find corpora/silesia -type f -printf '%s\n' | awk '{s+=$1} END {print s}')" -eq 211938580

      - name: Run EXP-114B qualification
        run: |
          python3 research/benchmarks/exp113_native_context_router.py \
            build/kephir2/kephir2_native_k75_cli
          mv exp113_results.json exp114b_results.json

      - name: Validate candidate
        run: |
          python3 - <<'PY'
          import json
          d=json.load(open("exp114b_results.json"))
          s,h=d["datasets"]
          assert s["policy_match_count"] == 12
          assert h["policy_match_count"] == 10
          assert len(s["harmful_selections"]) == 0
          assert len(h["harmful_selections"]) == 0
          assert s["regret_vs_oracle"] == 0
          assert h["regret_vs_oracle"] <= 1056
          assert s["gain_vs_baseline"] >= 1200000
          print(
              "EXP114B_VALIDATION_PASS",
              "SILESIA_BYTES",s["adaptive_bytes"],
              "SILESIA_RATIO",s["adaptive_ratio"],
              "SILESIA_GAIN",s["gain_vs_baseline"],
              "SILESIA_COMP_MBPS",s["adaptive_comp_MBps"],
              "SILESIA_DEC_MBPS",s["adaptive_dec_MBps"],
              "HOLDOUT_GAIN",h["gain_vs_baseline"],
              "HOLDOUT_REGRET",h["regret_vs_oracle"],
          )
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: exp114b-native-sampler-qualification
          path: exp114b_results.json
