name: KEPHIR 2 EXP-114A Sampler Geometry

on:
  workflow_dispatch:
  push:
    branches:
      - research/exp114-sampler-geometry
    paths:
      - "research/benchmarks/exp112_adaptive_context_router.py"
      - "research/benchmarks/exp114a_sampler_geometry.py"
      - ".github/workflows/exp114a_sampler_geometry.yml"
  pull_request:
    branches:
      - research/exp113-native-context-router
    paths:
      - "research/benchmarks/exp112_adaptive_context_router.py"
      - "research/benchmarks/exp114a_sampler_geometry.py"
      - ".github/workflows/exp114a_sampler_geometry.yml"

jobs:
  study:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Download canonical Silesia
        run: |
          mkdir -p corpora/silesia
          curl -L --fail --retry 4 -o /tmp/silesia.zip \
            https://sun.aei.polsl.pl/~sdeor/corpus/silesia.zip
          echo "c240c17d6805fb8a0bde763f1b94cd99  /tmp/silesia.zip" | md5sum -c -
          unzip -q /tmp/silesia.zip -d corpora/silesia
          test "$(find corpora/silesia -type f -printf '%s\n' | awk '{s+=$1} END {print s}')" -eq 211938580

      - name: Run EXP-114A
        run: python3 research/benchmarks/exp114a_sampler_geometry.py

      - name: Validate
        run: |
          python3 - <<'PY'
          import json
          d=json.load(open("exp114a_results.json"))
          assert d["experiment"]=="EXP-114A"
          assert len(d["datasets"])==2
          assert all(
              g["sampled_bytes"] <= 256*1024
              for ds in d["datasets"]
              for row in ds["files"]
              for g in row["geometries"].values()
          )
          print("EXP114A_VALIDATION_PASS")
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: exp114a-sampler-geometry
          path: exp114a_results.json
