name: AURORA FAST-D EXP37 Feature A-B

on:
  workflow_dispatch:
  push:
    branches: ["research/khepri-stream-codec"]
    paths:
      - "benchmarks/major_codecs/aurora_fastd_exp37_feature_ab.cpp"
      - ".github/workflows/aurora_fastd_exp37_feature_ab.yml"

jobs:
  feature-ab:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Install
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential
      - name: Generate FAST-D source
        run: |
          cat source_parts/src_gz_*.b64 | base64 -d | gunzip > KEPHIR_2_EXP23_BASE.cpp
          python3 make_exp26_source.py
          python3 make_exp27_source.py
          python3 make_exp31_source.py
          python3 make_exp33_source.py
          python3 make_exp37_source.py
          python3 make_exp38_source.py
          python3 make_exp39_source.py
          K2_CHAIN_DEPTH_VALUE=24 K2_LAZY_DEPTH_VALUE=12 K2_PRED_MASK_VALUE=255 python3 make_speed1_source.py
          python3 make_fastd_source.py
      - name: Build six FAST-D variants
        run: |
          common="-O3 -std=c++20 -fPIC -shared -DNDEBUG -DNO_INTERNAL_VERIFY -DAURORA_PLUGIN_FASTD -pthread -Isrc/cpp/aurora_media"
          src="src/cpp/aurora_media/AuroraKhepriFastDMemoryAdapter.cpp benchmarks/major_codecs/aurora_backend_plugin.cpp"
          g++ $common -DK2_ADAPT_MODE=9 -DK2_LAZY_MODE=0 -DK2_PSG_MODE=0 -DK2_DIST_TOPO_MODE=0 -DK2_DUAL_MATCH_MODE=0 -DK2_FUSED_MATCH_MODE=0 -DK2_FUSED2_MODE=0 $src -o libfast_base.so
          g++ $common -DK2_ADAPT_MODE=9 -DK2_LAZY_MODE=1 -DK2_PSG_MODE=0 -DK2_DIST_TOPO_MODE=0 -DK2_DUAL_MATCH_MODE=0 -DK2_FUSED_MATCH_MODE=0 -DK2_FUSED2_MODE=0 $src -o libfast_lazy.so
          g++ $common -DK2_ADAPT_MODE=9 -DK2_LAZY_MODE=0 -DK2_PSG_MODE=3 -DK2_DIST_TOPO_MODE=0 -DK2_DUAL_MATCH_MODE=0 -DK2_FUSED_MATCH_MODE=0 -DK2_FUSED2_MODE=0 $src -o libfast_psg.so
          g++ $common -DK2_ADAPT_MODE=9 -DK2_LAZY_MODE=0 -DK2_PSG_MODE=0 -DK2_DIST_TOPO_MODE=8 -DK2_DUAL_MATCH_MODE=0 -DK2_FUSED_MATCH_MODE=0 -DK2_FUSED2_MODE=0 $src -o libfast_dist.so
          g++ $common -DK2_ADAPT_MODE=9 -DK2_LAZY_MODE=0 -DK2_PSG_MODE=0 -DK2_DIST_TOPO_MODE=0 -DK2_DUAL_MATCH_MODE=1 -DK2_FUSED_MATCH_MODE=0 -DK2_FUSED2_MODE=0 $src -o libfast_dual.so
          g++ $common -DK2_ADAPT_MODE=9 -DK2_LAZY_MODE=1 -DK2_PSG_MODE=3 -DK2_DIST_TOPO_MODE=8 -DK2_DUAL_MATCH_MODE=1 -DK2_FUSED_MATCH_MODE=0 -DK2_FUSED2_MODE=0 $src -o libfast_bundle.so
      - name: Build benchmark
        run: |
          g++ -O3 -std=c++20 -DNDEBUG -pthread             src/cpp/aurora_media/AuroraVideoMotion.cpp src/cpp/aurora_media/AuroraVideoResidual.cpp             benchmarks/major_codecs/aurora_fastd_exp37_feature_ab.cpp             -Isrc/cpp/aurora_media -ldl -o aurora_fastd_exp37_feature_ab
      - name: Run benchmark
        run: |
          ./aurora_fastd_exp37_feature_ab | tee feature_ab_results.txt
      - uses: actions/upload-artifact@v4
        with:
          name: aurora-fastd-exp37-feature-ab
          path: feature_ab_results.txt
