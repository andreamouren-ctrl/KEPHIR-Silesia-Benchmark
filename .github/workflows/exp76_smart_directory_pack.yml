name: AURORA EXP-76 Smart Directory Packing
on:
  pull_request:
    branches:
      - project/aurora-compressor
    paths:
      - "research/packaging/exp76_smart_directory_pack.py"
      - ".github/workflows/exp76_smart_directory_pack.yml"

jobs:
  exp76-directory-pack:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install benchmark tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential p7zip-full xz-utils zstd brotli bzip2 gzip

      - name: Build KEPHIR backend
        run: |
          cat engine/source_parts/src_gz_*.b64 | base64 -d | gunzip > KEPHIR_2_EXP23_BASE.cpp
          python3 research/generators/general/make_exp26_source.py
          python3 research/generators/general/make_exp27_source.py
          python3 research/generators/general/make_exp31_source.py
          python3 research/generators/general/make_exp33_source.py
          python3 research/generators/general/make_exp37_source.py
          g++ -O3 -std=c++20 -DNDEBUG -DNO_INTERNAL_VERIFY \
            -DK2_ADAPT_MODE=9 -DK2_LAZY_MODE=1 -DK2_PSG_MODE=3 \
            -DK2_DIST_TOPO_MODE=8 -DK2_DUAL_MATCH_MODE=1 \
            -pthread KEPHIR_2_EXP37_DUAL_MATCH.cpp -o kephir37

      - name: Run EXP-76 smart directory pack
        env:
          KEPHIR_WORKERS: "16"
        run: python3 research/packaging/exp76_smart_directory_pack.py

      - name: Validate and print KEPHIR comparison
        run: |
          python3 - <<'PY'
          import json
          d=json.load(open("exp76_results.json"))
          assert d["smart"]["sha_ok"]
          assert d["flat"]["sha_ok"]
          assert d["per_file"]["sha_ok"]
          print("TRACKED_FILES",d["tracked_files"])
          print("LOGICAL_BYTES",d["logical_bytes"])
          print("GROUPS",json.dumps(d["group_bytes"],sort_keys=True))
          print("MANIFEST_BYTES",d["manifest_bytes"])
          print("SMART",json.dumps(d["smart"],sort_keys=True))
          print("FLAT",json.dumps(d["flat"],sort_keys=True))
          print("PER_FILE",json.dumps(d["per_file"],sort_keys=True))
          PY

      - name: Compare mainstream solid compressors on same compact flat payload
        run: |
          mkdir -p exp76_competitors
          SRC=exp76_directory_pack/flat_payload.bin
          /usr/bin/time -f "BROTLI_TIME=%e" sh -c 'brotli -q 11 -c "$1" > exp76_competitors/brotli.br' _ "$SRC"
          /usr/bin/time -f "XZ_TIME=%e" sh -c 'xz -9 -T0 -c "$1" > exp76_competitors/xz.xz' _ "$SRC"
          /usr/bin/time -f "ZSTD_TIME=%e" sh -c 'zstd -19 -T0 -q -c "$1" > exp76_competitors/zstd.zst' _ "$SRC"
          /usr/bin/time -f "BZIP2_TIME=%e" sh -c 'bzip2 -9 -c "$1" > exp76_competitors/bzip2.bz2' _ "$SRC"
          /usr/bin/time -f "GZIP_TIME=%e" sh -c 'gzip -n -9 -c "$1" > exp76_competitors/gzip.gz' _ "$SRC"
          7z a -bd -y -t7z -mx=9 -m0=lzma2 -mmt=on exp76_competitors/7z.7z "$SRC" >/dev/null
          echo "COMPETITOR_SIZES"
          stat -c '%n %s' exp76_competitors/* | sort -k2n

      - name: Verify competitor lossless
        run: |
          SRC=exp76_directory_pack/flat_payload.bin
          mkdir -p exp76_verify
          brotli -d -c exp76_competitors/brotli.br > exp76_verify/brotli
          xz -d -c exp76_competitors/xz.xz > exp76_verify/xz
          zstd -d -q -c exp76_competitors/zstd.zst > exp76_verify/zstd
          bzip2 -d -c exp76_competitors/bzip2.bz2 > exp76_verify/bzip2
          gzip -d -c exp76_competitors/gzip.gz > exp76_verify/gzip
          7z e -so exp76_competitors/7z.7z > exp76_verify/7z
          SHA=$(sha256sum "$SRC" | awk '{print $1}')
          for f in exp76_verify/*; do test "$(sha256sum "$f" | awk '{print $1}')" = "$SHA"; done
          echo "COMPETITOR_SHA_ALL_PASS"

      - uses: actions/upload-artifact@v4
        with:
          name: exp76-smart-directory-results
          path: |
            exp76_results.json
            exp76_directory_pack/repository.k76d
