name: AURORA FAST-D Runtime Depth Inspect
on:
  workflow_dispatch:
  push:
    branches: ["research/khepri-stream-codec"]
    paths: [".github/workflows/aurora_fastd_runtime_depth_inspect.yml"]
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Generate Balanced
        run: |
          cat source_parts/src_gz_*.b64 | base64 -d | gunzip > KEPHIR_2_EXP23_BASE.cpp
          python3 make_exp26_source.py
          python3 make_exp27_source.py
          python3 make_exp31_source.py
          python3 make_exp33_source.py
          python3 make_exp37_source.py
          python3 make_exp38_source.py
          python3 make_exp39_source.py
          python3 make_fastd_video_profile_source.py balanced --match-prefilter none
      - name: Inspect depth call sites
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path("KEPHIR_SPEED_D_SOURCE.cpp").read_text().splitlines()
          for i,line in enumerate(s,1):
              if "findbest(" in line or "CHAIN_DEPTH" in line or "LAZY_DEPTH" in line or "localChainDepth" in line or "localLazyDepth" in line:
                  print(f"{i}: {line}")
          PY
