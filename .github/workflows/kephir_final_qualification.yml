name: KEPHIR 1.0 Final Candidate Qualification
on:
  pull_request:
    branches:
      - project/aurora-compressor
    paths:
      - "release/kephir_final.py"
      - "release/factory/khepri_factory_v1.json"
      - "release/final_qualification.py"
      - ".github/workflows/kephir_final_qualification.yml"

jobs:
  final-qualification:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install compressors and build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential p7zip-full xz-utils zstd brotli bzip2 gzip lz4 unzip curl

      - name: Build KEPHIR production backend
        run: |
          cat engine/source_parts/src_gz_*.b64 | base64 -d | gunzip > KEPHIR_2_EXP23_BASE.cpp
          python3 research/generators/general/make_exp26_source.py
          python3 research/generators/general/make_exp27_source.py
          python3 research/generators/general/make_exp31_source.py
          python3 research/generators/general/make_exp33_source.py
          python3 research/generators/general/make_exp37_source.py
          g++ -O3 -std=c++20 -DNDEBUG -DNO_INTERNAL_VERIFY             -DK2_ADAPT_MODE=9 -DK2_LAZY_MODE=1 -DK2_PSG_MODE=3             -DK2_DIST_TOPO_MODE=8 -DK2_DUAL_MATCH_MODE=1             -pthread KEPHIR_2_EXP37_DUAL_MATCH.cpp -o kephir37

      - name: Static and smoke validation
        run: |
          python3 -m py_compile release/kephir_final.py release/final_qualification.py
          python3 release/kephir_final.py --version
          rm -rf /tmp/kephir_smoke && mkdir -p /tmp/kephir_smoke/in/sub
          printf 'hello KEPHIR hello KEPHIR\n' > /tmp/kephir_smoke/in/a.txt
          python3 - <<'PY'
          from pathlib import Path
          Path('/tmp/kephir_smoke/in/sub/b.bin').write_bytes(bytes(range(256))*16)
          PY
          KEPHIR_HOME=/tmp/kephir_smoke/home python3 release/kephir_final.py compress /tmp/kephir_smoke/in /tmp/kephir_smoke/test.kpf --verify
          python3 release/kephir_final.py extract /tmp/kephir_smoke/test.kpf /tmp/kephir_smoke/out
          diff -r /tmp/kephir_smoke/in /tmp/kephir_smoke/out
          echo "FINAL_SMOKE_PASS"

      - name: Download canonical Silesia
        run: |
          mkdir -p corpora/silesia
          curl -L --fail --retry 4 -o /tmp/silesia.zip https://sun.aei.polsl.pl/~sdeor/corpus/silesia.zip
          echo "c240c17d6805fb8a0bde763f1b94cd99  /tmp/silesia.zip" | md5sum -c -
          unzip -q /tmp/silesia.zip -d corpora/silesia
          test "$(find corpora/silesia -type f | wc -l)" -eq 12

      - name: Environment
        run: |
          echo "CPUS=$(nproc)"
          echo "REPO_TRACKED=$(git ls-files | wc -l)"
          echo "FACTORY_STATES=$(python3 -c 'import json; print(len(json.load(open("release/factory/khepri_factory_v1.json"))["states"]))')"
          zstd --version
          brotli --version
          xz --version | head -1
          7z i | head -5 || true

      - name: Run final qualification
        env:
          KEPHIR_WORKERS: "16"
          KEPHIR_HOME: "/tmp/kephir_final_home"
        run: python3 release/final_qualification.py

      - name: Validate final qualification
        run: |
          python3 - <<'PY'
          import json
          d=json.load(open("kephir_final_qualification.json"))
          assert d["version"]=="1.0.0-rc1"
          for name,ds in d["datasets"].items():
              assert ds["files"]>0 and ds["logical_bytes"]>0
              assert all(r["verified"] for r in ds["rows"])
              kn=[r for r in ds["rows"] if r["name"].startswith("KEPHIR-1.0")]
              assert len(kn)==2
              print(name, "BEST", min(ds["rows"],key=lambda x:x["archive_bytes"])["name"])
              for r in kn:
                  print(name,r["name"],r["archive_bytes"],r["ratio"],r["comp_time_s"],r["stats"].get("groups",{}))
          print("FINAL_SHA_ALL_PASS")
          PY
          cat kephir_final_qualification.md

      - uses: actions/upload-artifact@v4
        with:
          name: kephir-1.0-final-qualification
          path: |
            kephir_final_qualification.json
            kephir_final_qualification.md
            kephir_final_qualification/*.kpf
