name: KEPHIR EXP-23 Parser Sweep
on:
  workflow_dispatch:
  push:
    paths:
      - "exp23_sweep.py"
      - ".github/workflows/exp23.yml"
jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential unzip
      - name: Rebuild and compile EXP-22
        run: |
          cat source_parts/src_gz_*.b64 | base64 -d | gunzip > KEPHIR_2_EXP22_LAZY19.cpp
          test "$(wc -c < KEPHIR_2_EXP22_LAZY19.cpp)" -eq 38695
          g++ -O3 -std=c++20 -DNDEBUG -DNO_INTERNAL_VERIFY -pthread KEPHIR_2_EXP22_LAZY19.cpp -o kephir22
      - name: Download and verify Silesia
        run: |
          curl -L --fail --retry 4 -o silesia.zip https://sun.aei.polsl.pl/~sdeor/corpus/silesia.zip
          echo "c240c17d6805fb8a0bde763f1b94cd99  silesia.zip" | md5sum -c -
          mkdir silesia
          unzip -q silesia.zip -d silesia
      - name: Run EXP-23 sweep
        run: python3 exp23_sweep.py
      - uses: actions/upload-artifact@v4
        with:
          name: exp23-sweep-results
          path: |
            exp23_sweep.json
            exp23_summary.json
