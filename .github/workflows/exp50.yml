name: KEPHIR EXP-50 Long Context Blocks
on:
  workflow_dispatch:
  push:
    paths:
      - "exp50_chunk_sweep.py"
      - ".github/workflows/exp50.yml"
jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - name: Install
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential unzip
      - name: Build EXP-37A chunk variants
        run: |
          cat source_parts/src_gz_*.b64 | base64 -d | gunzip > KEPHIR_2_EXP23_BASE.cpp
          python3 make_exp26_source.py
          python3 make_exp27_source.py
          python3 make_exp31_source.py
          python3 make_exp33_source.py
          python3 make_exp37_source.py
          for K in 512 1024 2048 4096; do
            g++ -O3 -std=c++20 -DNDEBUG -DNO_INTERNAL_VERIFY -DK2_ADAPT_MODE=9 -DK2_LAZY_MODE=1 -DK2_PSG_MODE=3 -DK2_DIST_TOPO_MODE=8 -DK2_DUAL_MATCH_MODE=1 -DK2_CHUNK_KIB=$K -pthread KEPHIR_2_EXP37_DUAL_MATCH.cpp -o kephir50_$K
          done
      - name: Silesia
        run: |
          curl -L --fail --retry 4 -o silesia.zip https://sun.aei.polsl.pl/~sdeor/corpus/silesia.zip
          echo "c240c17d6805fb8a0bde763f1b94cd99  silesia.zip" | md5sum -c -
          mkdir silesia
          unzip -q silesia.zip -d silesia
      - name: Run EXP-50
        run: python3 exp50_chunk_sweep.py
      - uses: actions/upload-artifact@v4
        with:
          name: exp50-results
          path: exp50_results.json
