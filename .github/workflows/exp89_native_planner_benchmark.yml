name: KEPHIR 2 EXP-89 Native Planner Benchmark
on:
  push:
    branches:
      - development/kephir-2-core
    paths:
      - "src/kephir2/**"
      - "research/packaging/exp89_native_planner_benchmark.py"
      - "research/packaging/router_matrix_v1.py"
      - "research/packaging/router_matrix_v2.py"
      - ".github/workflows/exp89_native_planner_benchmark.yml"
  workflow_dispatch:

jobs:
  exp89-native-planner:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure native KEPHIR 2 core
        run: cmake -S src/kephir2 -B build/kephir2 -DCMAKE_BUILD_TYPE=Release

      - name: Build native KEPHIR 2 core
        run: cmake --build build/kephir2 --config Release --parallel

      - name: Native smoke tests
        run: ctest --test-dir build/kephir2 --output-on-failure

      - name: Download canonical Silesia
        run: |
          mkdir -p corpora/silesia
          curl -L --fail --retry 4 -o /tmp/silesia.zip https://sun.aei.polsl.pl/~sdeor/corpus/silesia.zip
          echo "c240c17d6805fb8a0bde763f1b94cd99  /tmp/silesia.zip" | md5sum -c -
          unzip -q /tmp/silesia.zip -d corpora/silesia
          test "$(find corpora/silesia -type f | wc -l)" -eq 12

      - name: Run EXP-89 native planner benchmark
        run: |
          python3 research/packaging/exp89_native_planner_benchmark.py             build/kephir2/kephir2_planner_dump

      - name: Validate summary
        run: |
          python3 - <<'PY'
          import json
          d=json.load(open("exp89_results.json"))
          a=d["aggregate"]
          assert a["datasets"] == 16
          assert a["action_matches"] == 16
          assert a["feature_mismatches"] == 0
          print("EXP89_AGGREGATE",json.dumps(a,sort_keys=True))
          print("EXP89_NATIVE_PARITY_PASS")
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: exp89-native-planner-results
          path: exp89_results.json
