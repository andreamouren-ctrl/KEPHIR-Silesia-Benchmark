name: KEPHIR Speed-1 Sweep
on:
  workflow_dispatch:
  push:
    paths:
      - "make_speed1_source.py"
      - "speed1_sweep.py"
      - ".github/workflows/speed1.yml"
jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Install
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential unzip
      - name: Build base
        run: |
          cat source_parts/src_gz_*.b64 | base64 -d | gunzip > KEPHIR_2_EXP23_BASE.cpp
          python3 make_exp26_source.py
          python3 make_exp27_source.py
          python3 make_exp31_source.py
          python3 make_exp33_source.py
          python3 make_exp37_source.py
          python3 make_exp38_source.py
          python3 make_exp39_source.py
      - name: Build FAST-A
        env:
          K2_CHAIN_DEPTH_VALUE: "24"
          K2_LAZY_DEPTH_VALUE: "12"
          K2_PRED_MASK_VALUE: "63"
        run: |
          python3 make_speed1_source.py
          g++ -O3 -march=native -std=c++20 -DNDEBUG -DNO_INTERNAL_VERIFY -DK2_ADAPT_MODE=9 -DK2_LAZY_MODE=1 -DK2_PSG_MODE=0 -DK2_DIST_TOPO_MODE=0 -DK2_DUAL_MATCH_MODE=0 -DK2_FUSED_MATCH_MODE=0 -DK2_FUSED2_MODE=0 -pthread KEPHIR_SPEED_SOURCE.cpp -o kephir_fast_a
      - name: Build FAST-B
        env:
          K2_CHAIN_DEPTH_VALUE: "16"
          K2_LAZY_DEPTH_VALUE: "8"
          K2_PRED_MASK_VALUE: "63"
        run: |
          python3 make_speed1_source.py
          g++ -O3 -march=native -std=c++20 -DNDEBUG -DNO_INTERNAL_VERIFY -DK2_ADAPT_MODE=9 -DK2_LAZY_MODE=1 -DK2_PSG_MODE=0 -DK2_DIST_TOPO_MODE=0 -DK2_DUAL_MATCH_MODE=0 -DK2_FUSED_MATCH_MODE=0 -DK2_FUSED2_MODE=0 -pthread KEPHIR_SPEED_SOURCE.cpp -o kephir_fast_b
      - name: Build FAST-C
        env:
          K2_CHAIN_DEPTH_VALUE: "12"
          K2_LAZY_DEPTH_VALUE: "6"
          K2_PRED_MASK_VALUE: "127"
        run: |
          python3 make_speed1_source.py
          g++ -O3 -march=native -std=c++20 -DNDEBUG -DNO_INTERNAL_VERIFY -DK2_ADAPT_MODE=9 -DK2_LAZY_MODE=1 -DK2_PSG_MODE=0 -DK2_DIST_TOPO_MODE=0 -DK2_DUAL_MATCH_MODE=0 -DK2_FUSED_MATCH_MODE=0 -DK2_FUSED2_MODE=0 -pthread KEPHIR_SPEED_SOURCE.cpp -o kephir_fast_c
      - name: Silesia
        run: |
          curl -L --fail --retry 4 -o silesia.zip https://sun.aei.polsl.pl/~sdeor/corpus/silesia.zip
          echo "c240c17d6805fb8a0bde763f1b94cd99  silesia.zip" | md5sum -c -
          mkdir silesia
          unzip -q silesia.zip -d silesia
      - name: Run speed sweep
        run: python3 speed1_sweep.py
      - uses: actions/upload-artifact@v4
        with:
          name: speed1-results
          path: speed1_results.json
