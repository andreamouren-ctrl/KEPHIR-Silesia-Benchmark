name: KHEPRI Stream KS-V03 Motion Controls

on:
  workflow_dispatch:

jobs:
  video:
    env:
      PYTHONPATH: research/video/lab:research/video/experiments:research/video/diagnostics:research/audio/lab:research/audio/experiments:research/backend:src/python/reference
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential ffmpeg curl python3-numpy

      - name: Build EXP-33H backend
        run: |
          cat source_parts/src_gz_*.b64 | base64 -d | gunzip > KEPHIR_2_EXP23_BASE.cpp
          python3 make_exp26_source.py
          python3 make_exp27_source.py
          python3 make_exp31_source.py
          python3 make_exp33_source.py
          g++ -O3 -std=c++20 -DNDEBUG -DNO_INTERNAL_VERIFY \
            -DK2_ADAPT_MODE=9 -DK2_LAZY_MODE=1 -DK2_PSG_MODE=3 -DK2_DIST_TOPO_MODE=8 \
            -pthread KEPHIR_2_EXP33_DISTANCE_TOPOLOGY.cpp -o kephir33

      - name: Download Foreman and Bus QCIF
        run: |
          curl -L --fail --retry 4 -o foreman.y4m https://media.xiph.org/video/derf/y4m/foreman_qcif.y4m
          curl -L --fail --retry 4 -o bus.y4m https://media.xiph.org/video/derf/y4m/bus_qcif_15fps.y4m
          ffmpeg -hide_banner -loglevel error -y -i foreman.y4m -pix_fmt yuv420p -f rawvideo foreman.yuv
          ffmpeg -hide_banner -loglevel error -y -i bus.y4m -pix_fmt yuv420p -f rawvideo bus.yuv
          python3 -c 'from pathlib import Path; f=176*144*3//2; vals=[("foreman.yuv",Path("foreman.yuv").stat().st_size),("bus.yuv",Path("bus.yuv").stat().st_size)]; assert all(n>0 and n%f==0 for _,n in vals),vals; print([(x,n,n//f) for x,n in vals])'

      - name: Run KS-V03
        run: |
          python3 research/video/experiments/ksv03_motion.py \
            --kephir ./kephir33 \
            --clip foreman:foreman.yuv:30000:1001 \
            --clip bus:bus.yuv:15:1

      - uses: actions/upload-artifact@v4
        with:
          name: khepri-stream-ksv03
          path: streaming/ksv03_out/ksv03_results.json
