name: Prototype CPU GPU Pipeline
on:
  workflow_dispatch:
  pull_request:
    branches:
      - project/aurora-compressor
    paths:
      - "research/gpu/khepri_gpu_tokenizer.cpp"
      - ".github/workflows/cpu_gpu_pipeline.yml"

jobs:
  build-and-selftest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install OpenCL headers
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential ocl-icd-opencl-dev
      - name: Build GPU tokenizer
        run: |
          g++ -O3 -std=c++20 -DNDEBUG research/gpu/khepri_gpu_tokenizer.cpp -lOpenCL -o khepri_gpu_tokenizer
      - name: Self-test exact reversibility
        run: ./khepri_gpu_tokenizer --self-test
