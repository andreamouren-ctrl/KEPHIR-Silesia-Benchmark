name: KEPHIR 2 EXP-119A Stride Transform Oracle

on:
  workflow_dispatch:
  push:
    branches:
      - research/exp119a-stride-transform-oracle
    paths:
      - "src/kephir2/**"
      - "research/benchmarks/exp119a_stride_transform_oracle.py"
      - ".github/workflows/exp119a_stride_transform_oracle.yml"
  pull_request:
    branches:
      - research/exp117-production-candidate
    paths:
      - "src/kephir2/**"
      - "research/benchmarks/exp119a_stride_transform_oracle.py"
      - ".github/workflows/exp119a_stride_transform_oracle.yml"

jobs:
  oracle:
    runs-on: ubuntu-latest
    timeout-minutes: 300

    steps:
      - uses: actions/checkout@v4

      - name: Build research helper
        run: |
          cmake -S src/kephir2 -B build/kephir2 -DCMAKE_BUILD_TYPE=Release
          cmake --build build/kephir2 --config Release --parallel

      - name: Regression suite
        run: ctest --test-dir build/kephir2 --output-on-failure

      - name: Materialize canonical Silesia
        run: |
          mkdir -p corpora/silesia
          curl -L --fail --retry 4 -o /tmp/silesia.zip \
            https://sun.aei.polsl.pl/~sdeor/corpus/silesia.zip
          echo "c240c17d6805fb8a0bde763f1b94cd99  /tmp/silesia.zip" | md5sum -c -
          unzip -q /tmp/silesia.zip -d corpora/silesia
          test "$(find corpora/silesia -type f -printf '%s\n' | awk '{s+=$1} END {print s}')" -eq 211938580

      - name: Measure reversible stride oracle
        run: |
          python3 research/benchmarks/exp119a_stride_transform_oracle.py \
            build/kephir2/kephir2_stride_transform_oracle | tee exp119a.log

      - name: Validate experiment integrity
        run: |
          python3 - <<'PY'
          import json
          d=json.load(open('exp119a_results.json'))
          assert d['experiment']=='EXP-119A'
          assert d['chunk_kib']==512
          assert d['existing_lags']==[0,2,4,16,1024]
          assert d['extended_lags']==[0,2,4,16,256,512,1024,2048,4096]
          s,r=d['datasets']
          assert s['dataset']=='silesia' and s['file_count']==12 and s['raw_bytes']==211938580
          assert r['dataset']=='raster_holdout' and r['file_count']==5
          for row in d['files']:
              assert all(v['sha_ok'] for v in row['lags'].values())
              assert row['extended_best_bytes'] <= row['existing_best_bytes']
          print(
              'EXP119A_VALIDATION_PASS',
              'SILESIA_GAIN',s['new_stride_gain_bytes'],
              'RASTER_GAIN',r['new_stride_gain_bytes'],
              'SILESIA_WINNERS',s['extended_winner_counts'],
              'RASTER_WINNERS',r['extended_winner_counts'],
          )
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: exp119a-stride-transform-oracle
          path: |
            exp119a_results.json
            exp119a.log
