name: KEPHIR Silesia Benchmark

on:
  workflow_dispatch:
  push:
    paths:
      - "benchmarks/silesia/bench_silesia.py"
      - "engine/source_parts/**"
      - ".github/workflows/silesia.yml"

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential zstd xz-utils gzip bzip2 zip unzip python3-pip
          python3 -m pip install --break-system-packages brotli lz4

      - name: Rebuild KEPHIR EXP-22 source
        run: |
          cat engine/source_parts/src_gz_*.b64 | base64 -d | gunzip > KEPHIR_2_EXP22_LAZY19.cpp
          test "$(wc -c < KEPHIR_2_EXP22_LAZY19.cpp)" -eq 38695

      - name: Download official Silesia corpus
        run: |
          curl -L --fail --retry 4 -o silesia.zip https://sun.aei.polsl.pl/~sdeor/corpus/silesia.zip
          echo "c240c17d6805fb8a0bde763f1b94cd99  silesia.zip" | md5sum -c -
          mkdir silesia
          unzip -q silesia.zip -d silesia

      - name: Verify canonical corpus
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, sys
          expected = {
            "dickens": (10192446,"88334708559f6db57d79096bc0aca07e"),
            "mozilla": (51220480,"c7789a2097f1ff944b0c737430a339b3"),
            "mr": (9970564,"38e623e3093b7bf2003ca4b1bbc19927"),
            "nci": (33553445,"31f85bc8706f3c921104e7c169e2e2e1"),
            "ooffice": (6152192,"573c4ae915e36631d8f2dcffb9b9b66d"),
            "osdb": (10085684,"e734b0c48e6a982adfb5802da3032ecd"),
            "reymont": (6627202,"d8f54d78105079775f32d76dc55fc671"),
            "samba": (21606400,"154eaea7ea70e89f6339ff0abf4112ca"),
            "sao": (7251944,"79e95a22e18cd82b7e42bf91b380d30b"),
            "webster": (41458703,"474931ad907ac27bf962c75ded46c069"),
            "x-ray": (8474240,"9baec32ad14ec3eff487d254382cb91c"),
            "xml": (5345280,"9b09c0c80104adb8aae910b7d7db003e"),
          }
          root=Path("silesia")
          total=0
          for n,(sz,md5) in expected.items():
              p=root/n
              if not p.exists():
                  print("MISSING",n); sys.exit(1)
              got=hashlib.md5(p.read_bytes()).hexdigest()
              if p.stat().st_size!=sz or got!=md5:
                  print("FAIL",n,p.stat().st_size,got); sys.exit(1)
              total += sz
          print("SILESIA_CANONICAL_PASS",total)
          PY

      - name: Build KEPHIR EXP-22
        run: |
          g++ -O3 -std=c++20 -DNDEBUG -DNO_INTERNAL_VERIFY -pthread KEPHIR_2_EXP22_LAZY19.cpp -o kephir22

      - name: Run benchmark
        run: python3 benchmarks/silesia/bench_silesia.py

      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: kephir-silesia-results
          path: |
            results_silesia.csv
            results_silesia.json
            RESULTS.md
