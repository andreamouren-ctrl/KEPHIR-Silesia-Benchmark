name: EXP-117C Apply API Accounting Fix

on:
  push:
    branches:
      - research/exp117-production-candidate
    paths:
      - ".github/workflows/exp117c_apply_api_accounting_fix.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/exp117-production-candidate
          fetch-depth: 0

      - name: Apply surgical API accounting fix and regression assertions
        run: |
          python3 - <<'PY'
          from pathlib import Path

          c = Path('src/kephir2/src/kephir2_c.cpp')
          text = c.read_text()
          old = '''        if (archive[4] == static_cast<std::uint8_t>(kephir2::Kpf1Kind::File)) {
              const auto envelope = kephir2::decode_kpf1_file(archive);
              output_bytes = 0;
              engine->executor.extract_file(
                  archive,
                  output,
                  engine->backend,
                  backend_options);
          } else if ('''
          new = '''        if (archive[4] == static_cast<std::uint8_t>(kephir2::Kpf1Kind::File)) {
              const auto envelope = kephir2::decode_kpf1_file(archive);
              engine->executor.extract_file(
                  archive,
                  output,
                  engine->backend,
                  backend_options);

              const auto extracted = kephir2::safe_archive_target(
                  output,
                  envelope.name);
              if (!std::filesystem::is_regular_file(extracted)) {
                  throw std::runtime_error(
                      "extracted file missing after successful decode");
              }
              output_bytes = std::filesystem::file_size(extracted);
          } else if ('''
          if old not in text:
              raise SystemExit('kephir2_c.cpp target block not found')
          c.write_text(text.replace(old, new, 1))

          t = Path('src/kephir2/tests/production_candidate_api_smoke.cpp')
          text = t.read_text()

          replacements = [
              (
                  '''    assert(adaptive_extract_result.status == KEPHIR2_OK);
      assert(read_all(input) == read_all(adaptive_extract / input.filename()));''',
                  '''    assert(adaptive_extract_result.status == KEPHIR2_OK);
      assert(adaptive_extract_result.output_bytes == std::filesystem::file_size(input));
      assert(read_all(input) == read_all(adaptive_extract / input.filename()));'''
              ),
              (
                  '''    assert(kephir2_extract(
          engine,
          api_fast_s.c_str(),
          fast_extract_s.c_str(),
          &options,
          &fast_extract_result) == KEPHIR2_OK);
      assert(read_all(input) == read_all(fast_extract / input.filename()));''',
                  '''    assert(kephir2_extract(
          engine,
          api_fast_s.c_str(),
          fast_extract_s.c_str(),
          &options,
          &fast_extract_result) == KEPHIR2_OK);
      assert(fast_extract_result.status == KEPHIR2_OK);
      assert(fast_extract_result.output_bytes == std::filesystem::file_size(input));
      assert(read_all(input) == read_all(fast_extract / input.filename()));'''
              ),
              (
                  '''    assert(auto_extract_result.status == KEPHIR2_OK);
      assert(read_all(input) == read_all(auto_extract / input.filename()));''',
                  '''    assert(auto_extract_result.status == KEPHIR2_OK);
      assert(auto_extract_result.output_bytes == std::filesystem::file_size(input));
      assert(read_all(input) == read_all(auto_extract / input.filename()));'''
              ),
          ]

          for old, new in replacements:
              if old not in text:
                  raise SystemExit('production_candidate_api_smoke target block not found')
              text = text.replace(old, new, 1)
          t.write_text(text)
          PY

      - name: Build and run API regression suite
        run: |
          cmake -S src/kephir2 -B build/kephir2 -DCMAKE_BUILD_TYPE=Release
          cmake --build build/kephir2 --config Release --parallel
          ctest --test-dir build/kephir2 --output-on-failure

      - name: Commit fix
        run: |
          git config user.name "KEPHIR CI"
          git config user.email "actions@users.noreply.github.com"
          git add src/kephir2/src/kephir2_c.cpp src/kephir2/tests/production_candidate_api_smoke.cpp
          git diff --cached --check
          git commit -m "EXP-117C fix C API extraction byte accounting"
          git push origin HEAD:research/exp117-production-candidate
