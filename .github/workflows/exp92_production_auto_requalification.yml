name: KEPHIR 2 EXP-92 Production AUTO Requalification
on:
  push:
    branches:
      - development/kephir-2-core
    paths:
      - "src/kephir2/**"
      - "research/packaging/router_matrix_v1.py"
      - "research/packaging/router_matrix_v2.py"
      - "research/packaging/exp92_production_auto_requalification.py"
      - ".github/workflows/exp92_production_auto_requalification.yml"
  workflow_dispatch:

jobs:
  exp92-production-auto:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build native KEPHIR 2
        run: |
          cmake -S src/kephir2 -B build/kephir2 -DCMAKE_BUILD_TYPE=Release
          cmake --build build/kephir2 --config Release --parallel

      - name: Download canonical Silesia
        run: |
          mkdir -p corpora/silesia
          curl -L --fail --retry 4 -o /tmp/silesia.zip https://sun.aei.polsl.pl/~sdeor/corpus/silesia.zip
          echo "c240c17d6805fb8a0bde763f1b94cd99  /tmp/silesia.zip" | md5sum -c -
          unzip -q /tmp/silesia.zip -d corpora/silesia
          test "$(find corpora/silesia -type f | wc -l)" -eq 12

      - name: Run EXP-92
        run: |
          python3 research/packaging/exp92_production_auto_requalification.py \
            build/kephir2/kephir2_production_layout_bench

      - name: Validate result
        run: |
          python3 - <<'PY'
          import json
          d=json.load(open("exp92_results.json"))
          a=d["aggregate"]
          assert a["datasets"] == 16
          assert a["all_byte_perfect"]
          print("EXP92_AGGREGATE",json.dumps(a,sort_keys=True))
          print("EXP92_BYTE_PERFECT_ALL_PASS")
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: exp92-production-auto-results
          path: exp92_results.json
