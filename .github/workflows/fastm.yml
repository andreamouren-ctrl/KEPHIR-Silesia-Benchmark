name: KEPHIR FAST-M PGO
on:
  workflow_dispatch:
  push:
    paths:
      - "research/speed/fastm_bench.py"
      - ".github/workflows/fastm.yml"
jobs:
  bench:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - name: Install
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential unzip
      - name: Reconstruct FAST-K source
        run: |
          cat engine/source_parts/src_gz_*.b64 | base64 -d | gunzip > KEPHIR_2_EXP23_BASE.cpp
          python3 research/generators/general/make_exp26_source.py
          python3 research/generators/general/make_exp27_source.py
          python3 research/generators/general/make_exp31_source.py
          python3 research/generators/general/make_exp33_source.py
          python3 research/generators/general/make_exp37_source.py
          python3 research/generators/general/make_exp38_source.py
          python3 research/generators/general/make_exp39_source.py
          K2_CHAIN_DEPTH_VALUE=24 K2_LAZY_DEPTH_VALUE=12 K2_PRED_MASK_VALUE=255 python3 research/generators/speed/make_speed1_source.py
          python3 research/generators/speed/make_fastd_source.py
          python3 research/generators/speed/make_fastk_source.py
      - name: Silesia
        run: |
          curl -L --fail --retry 4 -o silesia.zip https://sun.aei.polsl.pl/~sdeor/corpus/silesia.zip
          echo "c240c17d6805fb8a0bde763f1b94cd99  silesia.zip" | md5sum -c -
          mkdir silesia
          unzip -q silesia.zip -d silesia
      - name: Build baseline and train PGO
        run: |
          BASE="-O3 -march=native -std=c++20 -DNDEBUG -DNO_INTERNAL_VERIFY -DK2_ADAPT_MODE=9 -DK2_LAZY_MODE=0 -DK2_PSG_MODE=0 -DK2_DIST_TOPO_MODE=0 -DK2_DUAL_MATCH_MODE=0 -DK2_FUSED_MATCH_MODE=0 -DK2_FUSED2_MODE=0 -pthread"
          g++ $BASE KEPHIR_FAST_K.cpp -o fast_k
          mkdir -p pgo
          g++ $BASE -fprofile-generate=pgo KEPHIR_FAST_K.cpp -o fast_m_train
          ./fast_m_train cp silesia/mozilla train_mozilla.aur 1 6.55 9.42 1.20
          ./fast_m_train cp silesia/nci train_nci.aur 1 6.55 9.42 1.20
          ./fast_m_train cp silesia/sao train_sao.aur 1 6.55 9.42 1.20
          g++ $BASE -fprofile-use=pgo -fprofile-correction KEPHIR_FAST_K.cpp -o fast_m
      - name: Benchmark A-B
        run: python3 research/speed/fastm_bench.py
      - uses: actions/upload-artifact@v4
        with:
          name: fastm-results
          path: fastm_results.json
