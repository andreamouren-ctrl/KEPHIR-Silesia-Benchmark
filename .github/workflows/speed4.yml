name: KEPHIR Speed-4 Literal Hotpath
on:
  workflow_dispatch:
  push:
    paths:
      - "research/generators/speed/make_speed4_source.py"
      - "research/speed/speed4_bench.py"
      - ".github/workflows/speed4.yml"
jobs:
  bench:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Install
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential unzip
      - name: Build base
        run: |
          cat engine/source_parts/src_gz_*.b64 | base64 -d | gunzip > KEPHIR_2_EXP23_BASE.cpp
          python3 research/generators/general/make_exp26_source.py
          python3 research/generators/general/make_exp27_source.py
          python3 research/generators/general/make_exp31_source.py
          python3 research/generators/general/make_exp33_source.py
          python3 research/generators/general/make_exp37_source.py
          python3 research/generators/general/make_exp38_source.py
          python3 research/generators/general/make_exp39_source.py
      - name: Build FAST-F
        env: {FAST_LITERAL_MODE: "1"}
        run: |
          python3 research/generators/speed/make_speed4_source.py
          g++ -O3 -march=native -std=c++20 -DNDEBUG -DNO_INTERNAL_VERIFY -DK2_ADAPT_MODE=9 -DK2_LAZY_MODE=0 -DK2_PSG_MODE=0 -DK2_DIST_TOPO_MODE=0 -DK2_DUAL_MATCH_MODE=0 -DK2_FUSED_MATCH_MODE=0 -DK2_FUSED2_MODE=0 -pthread KEPHIR_SPEED4.cpp -o fast_f
      - name: Build FAST-G
        env: {FAST_LITERAL_MODE: "2"}
        run: |
          python3 research/generators/speed/make_speed4_source.py
          g++ -O3 -march=native -std=c++20 -DNDEBUG -DNO_INTERNAL_VERIFY -DK2_ADAPT_MODE=9 -DK2_LAZY_MODE=0 -DK2_PSG_MODE=0 -DK2_DIST_TOPO_MODE=0 -DK2_DUAL_MATCH_MODE=0 -DK2_FUSED_MATCH_MODE=0 -DK2_FUSED2_MODE=0 -pthread KEPHIR_SPEED4.cpp -o fast_g
      - name: Build FAST-H
        env: {FAST_LITERAL_MODE: "3"}
        run: |
          python3 research/generators/speed/make_speed4_source.py
          g++ -O3 -march=native -std=c++20 -DNDEBUG -DNO_INTERNAL_VERIFY -DK2_ADAPT_MODE=9 -DK2_LAZY_MODE=0 -DK2_PSG_MODE=0 -DK2_DIST_TOPO_MODE=0 -DK2_DUAL_MATCH_MODE=0 -DK2_FUSED_MATCH_MODE=0 -DK2_FUSED2_MODE=0 -pthread KEPHIR_SPEED4.cpp -o fast_h
      - name: Silesia
        run: |
          curl -L --fail --retry 4 -o silesia.zip https://sun.aei.polsl.pl/~sdeor/corpus/silesia.zip
          echo "c240c17d6805fb8a0bde763f1b94cd99  silesia.zip" | md5sum -c -
          mkdir silesia
          unzip -q silesia.zip -d silesia
      - name: Benchmark
        run: python3 research/speed/speed4_bench.py
      - uses: actions/upload-artifact@v4
        with:
          name: speed4-results
          path: speed4_results.json
