name: KS08 Multichannel Decorrelation
on:
  workflow_dispatch:
  push:
    branches:
      - research/khepri-stream-codec
    paths:
      - research/audio/experiments/ks08_multichannel_decorrelation.py
      - research/audio/lab/kstream_kmrl_frontend.py
      - .github/workflows/ks08_multichannel_decorrelation.yml

jobs:
  ks08:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Run decorrelation matrix
        env:
          PYTHONPATH: .
        run: |
          python3 research/audio/experiments/ks08_multichannel_decorrelation.py | tee ks08.txt
      - name: Validate
        run: |
          test "$(grep -c 'KS08_PASS' ks08.txt)" -eq 12
      - uses: actions/upload-artifact@v4
        with:
          name: ks08-multichannel-decorrelation
          path: ks08.txt
