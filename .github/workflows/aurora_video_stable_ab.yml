name: AURORA Video Stable A-B Benchmark

on:
  workflow_dispatch:
  push:
    branches: ["research/khepri-stream-codec"]
    paths:
      - "benchmarks/major_codecs/aurora_video_stable_ab.cpp"
      - ".github/workflows/aurora_video_stable_ab.yml"
      - "benchmarks/major_codecs/aurora_backend_plugin.cpp"
      - "src/cpp/aurora_media/AuroraVideoMotion.cpp"

jobs:
  stable-ab:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Install
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential
      - name: Generate engines
        run: |
          cat source_parts/src_gz_*.b64 | base64 -d | gunzip > KEPHIR_2_EXP23_BASE.cpp
          python3 make_exp26_source.py
          python3 make_exp27_source.py
          python3 make_exp31_source.py
          python3 make_exp33_source.py
          python3 make_exp37_source.py
          python3 make_exp38_source.py
          python3 make_exp39_source.py
          K2_CHAIN_DEPTH_VALUE=24 K2_LAZY_DEPTH_VALUE=12 K2_PRED_MASK_VALUE=255 python3 make_speed1_source.py
          python3 make_fastd_source.py
          cp KEPHIR_SPEED_D_SOURCE.cpp KEPHIR_SPEED_D_BASELINE.cpp
          K2_MEDIA_EARLY_MODE=1 python3 make_fastd_media_source.py
          cp KEPHIR_SPEED_MEDIA_SOURCE.cpp KEPHIR_SPEED_D_EARLY.cpp
          sed 's#KEPHIR_SPEED_D_SOURCE.cpp#KEPHIR_SPEED_D_BASELINE.cpp#' src/cpp/aurora_media/AuroraKhepriFastDMemoryAdapter.cpp > /tmp/FastBaselineAdapter.cpp
          sed 's#KEPHIR_SPEED_D_SOURCE.cpp#KEPHIR_SPEED_D_EARLY.cpp#' src/cpp/aurora_media/AuroraKhepriFastDMemoryAdapter.cpp > /tmp/FastEarlyAdapter.cpp
      - name: Build EXP-37A plugin
        run: |
          g++ -O3 -std=c++20 -fPIC -shared -DNDEBUG -DNO_INTERNAL_VERIFY             -DK2_ADAPT_MODE=9 -DK2_LAZY_MODE=1 -DK2_PSG_MODE=3             -DK2_DIST_TOPO_MODE=8 -DK2_DUAL_MATCH_MODE=1 -pthread             src/cpp/aurora_media/AuroraKhepriExp37MemoryAdapter.cpp             benchmarks/major_codecs/aurora_backend_plugin.cpp             -Isrc/cpp/aurora_media -o libaurora_exp37.so
      - name: Build FAST-D baseline plugin
        run: |
          g++ -O3 -std=c++20 -fPIC -shared -DNDEBUG -DNO_INTERNAL_VERIFY -DAURORA_PLUGIN_FASTD             -DK2_ADAPT_MODE=9 -DK2_LAZY_MODE=0 -DK2_PSG_MODE=0             -DK2_DIST_TOPO_MODE=0 -DK2_DUAL_MATCH_MODE=0             -DK2_FUSED_MATCH_MODE=0 -DK2_FUSED2_MODE=0 -pthread             /tmp/FastBaselineAdapter.cpp benchmarks/major_codecs/aurora_backend_plugin.cpp             -Isrc/cpp/aurora_media -o libaurora_fastd_baseline.so
      - name: Build FAST-D early plugin
        run: |
          g++ -O3 -std=c++20 -fPIC -shared -DNDEBUG -DNO_INTERNAL_VERIFY -DAURORA_PLUGIN_FASTD             -DK2_ADAPT_MODE=9 -DK2_LAZY_MODE=0 -DK2_PSG_MODE=0             -DK2_DIST_TOPO_MODE=0 -DK2_DUAL_MATCH_MODE=0             -DK2_FUSED_MATCH_MODE=0 -DK2_FUSED2_MODE=0 -pthread             /tmp/FastEarlyAdapter.cpp benchmarks/major_codecs/aurora_backend_plugin.cpp             -Isrc/cpp/aurora_media -o libaurora_fastd_early.so
      - name: Build stable benchmark
        run: |
          g++ -O3 -std=c++20 -DNDEBUG -pthread             src/cpp/aurora_media/AuroraVideoMotion.cpp             src/cpp/aurora_media/AuroraVideoResidual.cpp             benchmarks/major_codecs/aurora_video_stable_ab.cpp             -Isrc/cpp/aurora_media -ldl -o aurora_video_stable_ab
      - name: Run stable A-B
        run: |
          ./aurora_video_stable_ab | tee stable_ab_results.txt
      - uses: actions/upload-artifact@v4
        with:
          name: aurora-video-stable-ab
          path: stable_ab_results.txt
