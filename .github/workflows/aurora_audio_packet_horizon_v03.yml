name: AURORA Audio Packet Horizon v0.3

on:
  workflow_dispatch:
  push:
    branches:
      - "research/khepri-stream-codec"
    paths:
      - "benchmarks/major_codecs/benchmark_audio_packet_horizon_v03.py"
      - "src/python/reference/**"
      - "research/audio/**"
      - ".github/workflows/aurora_audio_packet_horizon_v03.yml"

jobs:
  bench:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Install
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential ffmpeg curl python3-numpy
      - name: Build KHEPRI EXP-37A
        run: |
          cat engine/khepri/source_parts/src_gz_*.b64 | base64 -d | gunzip > KEPHIR_2_EXP23_BASE.cpp
          python3 engine/khepri/generators/make_exp26_source.py
          python3 engine/khepri/generators/make_exp27_source.py
          python3 engine/khepri/generators/make_exp31_source.py
          python3 engine/khepri/generators/make_exp33_source.py
          python3 engine/khepri/generators/make_exp37_source.py
          g++ -O3 -std=c++20 -DNDEBUG -DNO_INTERNAL_VERIFY \
            -DK2_ADAPT_MODE=9 -DK2_LAZY_MODE=1 -DK2_PSG_MODE=3 -DK2_DIST_TOPO_MODE=8 \
            -DK2_DUAL_MATCH_MODE=1 -pthread KEPHIR_2_EXP37_DUAL_MATCH.cpp -o kephir37
      - name: Prepare audio
        run: |
          curl -L --fail --retry 4 -o sintel_audio.flac https://media.xiph.org/sintel/sintel_trailer-audio.flac
          ffmpeg -hide_banner -loglevel error -y -i sintel_audio.flac             -ac 2 -ar 48000 -sample_fmt s16 -f s16le sintel_audio.raw
      - name: Run
        env:
          PYTHONPATH: src/python/reference:research/audio/lab:research/audio/experiments:research/video/lab:research/video/experiments:research/backend
        run: |
          python3 benchmarks/major_codecs/benchmark_audio_packet_horizon_v03.py             --audio sintel_audio.raw --kephir ./kephir37
      - uses: actions/upload-artifact@v4
        with:
          name: aurora-audio-packet-horizon-v03
          path: results/audio/packet_horizon_v03/results.json
