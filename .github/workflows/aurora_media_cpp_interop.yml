name: AURORA Media C++20 Backend Interop

on:
  workflow_dispatch:
  push:
    branches:
      - "research/khepri-stream-codec"
    paths:
      - "src/cpp/aurora_media/**"
      - "src/python/reference/aurora_media_container.py"
      - "tests/cpp/**"
      - "src/cpp/aurora_media/AuroraCodecInterfaces.h"
      - "src/cpp/aurora_media/AuroraMediaError.h"
      - "src/cpp/aurora_media/AuroraMediaLimits.h"
      - "tests/python/test_cpp_python_binary_interop.py"
      - ".github/workflows/aurora_media_cpp_interop.yml"

jobs:
  interop:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Build C++20 container and stream backend
        run: |
          g++ -O2 -std=c++20 -Wall -Wextra -Werror \
            src/cpp/aurora_media/AuroraMediaContainer.cpp \
            src/cpp/aurora_media/AuroraStreamProtocol.cpp \
            tests/cpp/test_aurora_media_container.cpp \
            -Isrc/cpp/aurora_media -o aurora_media_cpp_test

      - name: Build C++20 media session backend
        run: |
          g++ -O2 -std=c++20 -Wall -Wextra -Werror \
            src/cpp/aurora_media/AuroraMediaContainer.cpp \
            src/cpp/aurora_media/AuroraMediaSession.cpp \
            tests/cpp/test_aurora_media_session.cpp \
            -Isrc/cpp/aurora_media -o aurora_media_session_test

      - name: Build typed codec interface test
        run: |
          g++ -O2 -std=c++20 -Wall -Wextra -Werror \
            tests/cpp/test_aurora_codec_interfaces.cpp \
            -Isrc/cpp/aurora_media -o aurora_codec_interfaces_test

      - name: Build resource-limit test
        run: |
          g++ -O2 -std=c++20 -Wall -Wextra -Werror \
            src/cpp/aurora_media/AuroraMediaContainer.cpp \
            src/cpp/aurora_media/AuroraStreamProtocol.cpp \
            tests/cpp/test_aurora_limits.cpp \
            -Isrc/cpp/aurora_media -o aurora_limits_test

      - name: Typed codec interfaces
        run: |
          ./aurora_codec_interfaces_test

      - name: Resource limits
        run: |
          ./aurora_limits_test limits_test.aum

      - name: Build AUM corruption matrix test
        run: |
          g++ -O2 -std=c++20 -Wall -Wextra -Werror \
            src/cpp/aurora_media/AuroraMediaContainer.cpp \
            tests/cpp/test_aurora_corruption_matrix.cpp \
            -Isrc/cpp/aurora_media -o aurora_corruption_matrix_test

      - name: AUM corruption matrix
        run: |
          ./aurora_corruption_matrix_test corruption_matrix_out

      - name: Build in-process KHEPRI contract test
        run: |
          g++ -O2 -std=c++20 -Wall -Wextra -Werror \
            tests/cpp/test_aurora_khepri_backend.cpp \
            -Isrc/cpp/aurora_media -o aurora_khepri_contract_test

      - name: In-process KHEPRI contract
        run: |
          ./aurora_khepri_contract_test

      - name: Build 4K tile planner test
        run: |
          g++ -O2 -std=c++20 -Wall -Wextra -Werror \
            tests/cpp/test_aurora_video_4k_plan.cpp \
            -Isrc/cpp/aurora_media -o aurora_video_4k_plan_test

      - name: Validate 4K tile planner
        run: |
          ./aurora_video_4k_plan_test

      - name: Build 4K stream scheduler test
        run: |
          g++ -O2 -std=c++20 -Wall -Wextra -Werror \
            tests/cpp/test_aurora_video_4k_scheduler.cpp \
            -Isrc/cpp/aurora_media -o aurora_video_4k_scheduler_test

      - name: Validate 4K stream scheduler
        run: |
          ./aurora_video_4k_scheduler_test

      - name: Build video profile test
        run: |
          g++ -O2 -std=c++20 -Wall -Wextra -Werror \
            tests/cpp/test_aurora_video_profiles.cpp \
            -Isrc/cpp/aurora_media -o aurora_video_profiles_test

      - name: Validate video profiles
        run: |
          ./aurora_video_profiles_test

      - name: Build native video residual tests
        run: |
          g++ -O2 -std=c++20 -Wall -Wextra -Werror \
            src/cpp/aurora_media/AuroraVideoResidual.cpp \
            tests/cpp/test_aurora_video_residual.cpp \
            -Isrc/cpp/aurora_media -o aurora_video_residual_test

          g++ -O2 -std=c++20 -Wall -Wextra -Werror \
            src/cpp/aurora_media/AuroraVideoResidual.cpp \
            tests/cpp/test_aurora_video_4k_tile_codec.cpp \
            -Isrc/cpp/aurora_media -o aurora_video_4k_tile_codec_test

      - name: Validate native video residual path
        run: |
          ./aurora_video_residual_test
          ./aurora_video_4k_tile_codec_test

      - name: Build native MC8R4 motion test
        run: |
          g++ -O2 -std=c++20 -Wall -Wextra -Werror \
            src/cpp/aurora_media/AuroraVideoMotion.cpp \
            src/cpp/aurora_media/AuroraVideoResidual.cpp \
            tests/cpp/test_aurora_video_motion.cpp \
            -Isrc/cpp/aurora_media -o aurora_video_motion_test

      - name: Validate native MC8R4 motion
        run: |
          ./aurora_video_motion_test

      - name: Generate KHEPRI EXP-37A source for in-process adapter
        run: |
          cat source_parts/src_gz_*.b64 | base64 -d | gunzip > KEPHIR_2_EXP23_BASE.cpp
          python3 make_exp26_source.py
          python3 make_exp27_source.py
          python3 make_exp31_source.py
          python3 make_exp33_source.py
          python3 make_exp37_source.py

      - name: Build KHEPRI EXP-37A memory adapter
        run: |
          g++ -O2 -std=c++20 -Wall -Wextra -Werror \
            -DNDEBUG -DNO_INTERNAL_VERIFY \
            -DK2_ADAPT_MODE=9 -DK2_LAZY_MODE=1 -DK2_PSG_MODE=3 \
            -DK2_DIST_TOPO_MODE=8 -DK2_DUAL_MATCH_MODE=1 -pthread \
            src/cpp/aurora_media/AuroraKhepriExp37MemoryAdapter.cpp \
            tests/cpp/test_aurora_khepri_exp37_memory.cpp \
            -Isrc/cpp/aurora_media -o aurora_khepri_exp37_memory_test

      - name: KHEPRI EXP-37A memory adapter
        run: |
          ./aurora_khepri_exp37_memory_test

      - name: Build native video pipeline integration test
        run: |
          g++ -O2 -std=c++20 -Wall -Wextra -Werror \
            -DNDEBUG -DNO_INTERNAL_VERIFY \
            -DK2_ADAPT_MODE=9 -DK2_LAZY_MODE=1 -DK2_PSG_MODE=3 \
            -DK2_DIST_TOPO_MODE=8 -DK2_DUAL_MATCH_MODE=1 -pthread \
            src/cpp/aurora_media/AuroraKhepriExp37MemoryAdapter.cpp \
            src/cpp/aurora_media/AuroraVideoMotion.cpp \
            src/cpp/aurora_media/AuroraVideoResidual.cpp \
            tests/cpp/test_aurora_native_video_pipeline.cpp \
            -Isrc/cpp/aurora_media -o aurora_native_video_pipeline_test

      - name: Validate native video pipeline
        run: |
          ./aurora_native_video_pipeline_test

      - name: Python/C++ binary interop
        env:
          PYTHONPATH: src/python/reference
        run: |
          python3 tests/python/test_cpp_python_binary_interop.py \
            --cpp-test ./aurora_media_cpp_test

      - name: C++20 media session
        run: |
          ./aurora_media_session_test session_test.aum

      - name: Build generalized audio format matrix
        run: |
          g++ -O2 -std=c++20 -Wall -Wextra -Werror \
            src/cpp/aurora_media/AuroraMediaContainer.cpp \
            src/cpp/aurora_media/AuroraMediaSession.cpp \
            tests/cpp/test_aurora_audio_formats.cpp \
            -Isrc/cpp/aurora_media -o aurora_audio_formats_test

      - name: Validate generalized audio formats
        run: |
          ./aurora_audio_formats_test audio_format_matrix

      - name: Build A/V sync clock test
        run: |
          g++ -O2 -std=c++20 -Wall -Wextra -Werror \
            tests/cpp/test_aurora_av_sync.cpp \
            -Isrc/cpp/aurora_media -o aurora_av_sync_test

      - name: Validate A/V sync clock
        run: |
          ./aurora_av_sync_test

      - name: Build AUM A/V mux sync test
        run: |
          g++ -O2 -std=c++20 -Wall -Wextra -Werror \
            src/cpp/aurora_media/AuroraMediaContainer.cpp \
            src/cpp/aurora_media/AuroraMediaSession.cpp \
            tests/cpp/test_aurora_av_mux_sync.cpp \
            -Isrc/cpp/aurora_media -o aurora_av_mux_sync_test

      - name: Validate AUM A/V mux sync
        run: |
          ./aurora_av_mux_sync_test av_mux_sync_10min.aum

      - uses: actions/upload-artifact@v4
        with:
          name: aurora-media-cpp-interop
          path: results/backend/cpp_interop/interop_results.json
