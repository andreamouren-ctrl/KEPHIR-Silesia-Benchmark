name: AURORA Media C++20 Backend Interop

on:
  workflow_dispatch:
  push:
    branches:
      - "research/khepri-stream-codec"
    paths:
      - "streaming/cpp/AuroraMediaContainer.h"
      - "streaming/cpp/AuroraMediaContainer.cpp"
      - "streaming/cpp/AuroraStreamProtocol.h"
      - "streaming/cpp/AuroraStreamProtocol.cpp"
      - "streaming/cpp/test_aurora_backend.cpp"
      - "streaming/test_cpp_python_interop.py"
      - ".github/workflows/aurora_media_cpp_interop.yml"

jobs:
  interop:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Build C++20 backend
        run: |
          g++ -O2 -std=c++20 -Wall -Wextra -Werror             streaming/cpp/AuroraMediaContainer.cpp             streaming/cpp/AuroraStreamProtocol.cpp             streaming/cpp/test_aurora_backend.cpp             -Istreaming/cpp -o aurora_media_cpp_test

      - name: Python/C++ binary interop
        run: |
          PYTHONPATH=streaming python3 streaming/test_cpp_python_interop.py             --cpp-test ./aurora_media_cpp_test

      - uses: actions/upload-artifact@v4
        with:
          name: aurora-media-cpp-interop
          path: streaming/cpp_interop_out/interop_results.json
