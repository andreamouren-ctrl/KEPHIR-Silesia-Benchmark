name: AURORA FAST-D Lazy64 Same-Run A-B

on:
  workflow_dispatch:
  push:
    branches: ["research/khepri-stream-codec"]
    paths:
      - "benchmarks/major_codecs/aurora_fastd_lazy64_same_run.cpp"
      - ".github/workflows/aurora_fastd_lazy64_same_run.yml"

jobs:
  same-run:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Install
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential
      - name: Generate baseline and lazy64
        run: |
          cat source_parts/src_gz_*.b64 | base64 -d | gunzip > KEPHIR_2_EXP23_BASE.cpp
          python3 make_exp26_source.py
          python3 make_exp27_source.py
          python3 make_exp31_source.py
          python3 make_exp33_source.py
          python3 make_exp37_source.py
          python3 make_exp38_source.py
          python3 make_exp39_source.py
          K2_CHAIN_DEPTH_VALUE=24 K2_LAZY_DEPTH_VALUE=12 K2_PRED_MASK_VALUE=255 python3 make_speed1_source.py
          python3 make_fastd_source.py
          cp KEPHIR_SPEED_D_SOURCE.cpp KEPHIR_SPEED_D_BASELINE.cpp
          K2_MEDIA_LAZY_SKIP_MODE=1 python3 make_fastd_parse_media_source.py
          cp KEPHIR_SPEED_PARSE_MEDIA_SOURCE.cpp KEPHIR_SPEED_D_LAZY64.cpp
          sed 's#KEPHIR_SPEED_D_SOURCE.cpp#KEPHIR_SPEED_D_BASELINE.cpp#' src/cpp/aurora_media/AuroraKhepriFastDMemoryAdapter.cpp > /tmp/FastBaselineAdapter.cpp
          sed 's#KEPHIR_SPEED_D_SOURCE.cpp#KEPHIR_SPEED_D_LAZY64.cpp#' src/cpp/aurora_media/AuroraKhepriFastDMemoryAdapter.cpp > /tmp/FastLazy64Adapter.cpp
      - name: Build baseline plugin
        run: |
          g++ -O3 -std=c++20 -fPIC -shared -DNDEBUG -DNO_INTERNAL_VERIFY -DAURORA_PLUGIN_FASTD             -DK2_ADAPT_MODE=9 -DK2_LAZY_MODE=0 -DK2_PSG_MODE=0             -DK2_DIST_TOPO_MODE=0 -DK2_DUAL_MATCH_MODE=0             -DK2_FUSED_MATCH_MODE=0 -DK2_FUSED2_MODE=0 -pthread             /tmp/FastBaselineAdapter.cpp benchmarks/major_codecs/aurora_backend_plugin.cpp             -Isrc/cpp/aurora_media -o libaurora_fastd_baseline.so
      - name: Build lazy64 plugin
        run: |
          g++ -O3 -std=c++20 -fPIC -shared -DNDEBUG -DNO_INTERNAL_VERIFY -DAURORA_PLUGIN_FASTD             -DK2_ADAPT_MODE=9 -DK2_LAZY_MODE=0 -DK2_PSG_MODE=0             -DK2_DIST_TOPO_MODE=0 -DK2_DUAL_MATCH_MODE=0             -DK2_FUSED_MATCH_MODE=0 -DK2_FUSED2_MODE=0 -pthread             /tmp/FastLazy64Adapter.cpp benchmarks/major_codecs/aurora_backend_plugin.cpp             -Isrc/cpp/aurora_media -o libaurora_fastd_lazy64.so
      - name: Build A-B
        run: |
          g++ -O3 -std=c++20 -DNDEBUG -pthread             src/cpp/aurora_media/AuroraVideoMotion.cpp             src/cpp/aurora_media/AuroraVideoResidual.cpp             benchmarks/major_codecs/aurora_fastd_lazy64_same_run.cpp             -Isrc/cpp/aurora_media -ldl -o aurora_fastd_lazy64_same_run
      - name: Run A-B
        run: |
          ./aurora_fastd_lazy64_same_run | tee lazy64_ab_results.txt
      - uses: actions/upload-artifact@v4
        with:
          name: aurora-fastd-lazy64-same-run
          path: lazy64_ab_results.txt
