name: AURORA Video EXP65 Media Same-Run

on:
  workflow_dispatch:
  push:
    branches: ["research/khepri-stream-codec"]
    paths:
      - "benchmarks/major_codecs/aurora_exp65_media_plugin.cpp"
      - "benchmarks/major_codecs/aurora_video_exp65_same_run.cpp"
      - ".github/workflows/aurora_video_exp65_same_run.yml"

jobs:
  exp65-media:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Install
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential
      - name: Generate engines
        run: |
          cat source_parts/src_gz_*.b64 | base64 -d | gunzip > KEPHIR_2_EXP23_BASE.cpp
          python3 make_exp26_source.py
          python3 make_exp27_source.py
          python3 make_exp31_source.py
          python3 make_exp33_source.py
          python3 make_exp37_source.py
          python3 make_exp38_source.py
          python3 make_exp39_source.py
          K2_CHAIN_DEPTH_VALUE=24 K2_LAZY_DEPTH_VALUE=12 K2_PRED_MASK_VALUE=255 python3 make_speed1_source.py
          python3 make_fastd_source.py
      - name: Build FAST-D
        run: |
          g++ -O3 -std=c++20 -fPIC -shared -DNDEBUG -DNO_INTERNAL_VERIFY -DAURORA_PLUGIN_FASTD             -DK2_ADAPT_MODE=9 -DK2_LAZY_MODE=0 -DK2_PSG_MODE=0 -DK2_DIST_TOPO_MODE=0             -DK2_DUAL_MATCH_MODE=0 -DK2_FUSED_MATCH_MODE=0 -DK2_FUSED2_MODE=0 -pthread             src/cpp/aurora_media/AuroraKhepriFastDMemoryAdapter.cpp benchmarks/major_codecs/aurora_backend_plugin.cpp             -Isrc/cpp/aurora_media -o libfastd.so
      - name: Build EXP37
        run: |
          g++ -O3 -std=c++20 -fPIC -shared -DNDEBUG -DNO_INTERNAL_VERIFY             -DK2_ADAPT_MODE=9 -DK2_LAZY_MODE=1 -DK2_PSG_MODE=3 -DK2_DIST_TOPO_MODE=8 -DK2_DUAL_MATCH_MODE=1 -pthread             src/cpp/aurora_media/AuroraKhepriExp37MemoryAdapter.cpp benchmarks/major_codecs/aurora_backend_plugin.cpp             -Isrc/cpp/aurora_media -o libexp37.so
      - name: Build EXP65 Media
        run: |
          g++ -O3 -std=c++20 -fPIC -shared -DNDEBUG -DNO_INTERNAL_VERIFY             -DK2_ADAPT_MODE=9 -DK2_LAZY_MODE=1 -DK2_PSG_MODE=3 -DK2_DIST_TOPO_MODE=8 -DK2_DUAL_MATCH_MODE=1 -pthread             src/cpp/aurora_media/AuroraKhepriExp37MemoryAdapter.cpp benchmarks/major_codecs/aurora_exp65_media_plugin.cpp             -Isrc/cpp/aurora_media -o libexp65media.so
      - name: Build benchmark
        run: |
          g++ -O3 -std=c++20 -DNDEBUG -pthread             src/cpp/aurora_media/AuroraVideoMotion.cpp src/cpp/aurora_media/AuroraVideoResidual.cpp             benchmarks/major_codecs/aurora_video_exp65_same_run.cpp             -Isrc/cpp/aurora_media -ldl -o aurora_video_exp65_same_run
      - name: Run benchmark
        run: |
          ./aurora_video_exp65_same_run | tee exp65_video_results.txt
      - uses: actions/upload-artifact@v4
        with:
          name: aurora-video-exp65-media
          path: exp65_video_results.txt
