name: KEPHIR 2 EXP-111 Adaptive Inner Context

on:
  workflow_dispatch:
  push:
    branches:
      - research/exp111-adaptive-inner-context
    paths:
      - "src/kephir2/**"
      - "research/benchmarks/exp111_adaptive_inner_context.py"
      - ".github/workflows/exp111_adaptive_inner_context.yml"
  pull_request:
    branches:
      - development/kephir-2-core
    # EXP-111 measures K75 inner-context behaviour. Container/API-only work must
    # not download and benchmark the full Silesia corpus on every PR sync.
    # Deliberately do not include this workflow file itself here: otherwise once
    # edited in a long-lived PR, every later synchronize event matches forever.
    paths:
      - "src/kephir2/src/native_k75.cpp"
      - "src/kephir2/include/kephir2/native_k75.hpp"
      - "src/kephir2/include/kephir2/backend.hpp"
      - "src/kephir2/src/native37_blob.cpp"
      - "src/kephir2/include/kephir2/native37_blob.hpp"
      - "src/kephir2/backend/**"
      - "engine/source_parts/**"
      - "research/benchmarks/exp111_adaptive_inner_context.py"

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 300

    steps:
      - uses: actions/checkout@v4

      - name: Build native KEPHIR
        run: |
          cmake -S src/kephir2 -B build/kephir2 -DCMAKE_BUILD_TYPE=Release
          cmake --build build/kephir2 --config Release --parallel

      - name: Native test suite
        run: ctest --test-dir build/kephir2 --output-on-failure

      - name: Download canonical Silesia
        run: |
          mkdir -p corpora/silesia
          curl -L --fail --retry 4 -o /tmp/silesia.zip \
            https://sun.aei.polsl.pl/~sdeor/corpus/silesia.zip
          echo "c240c17d6805fb8a0bde763f1b94cd99  /tmp/silesia.zip" | md5sum -c -
          unzip -q /tmp/silesia.zip -d corpora/silesia
          test "$(find corpora/silesia -type f -printf '%s\n' | awk '{s+=$1} END {print s}')" -eq 211938580

      - name: Run EXP-111
        run: |
          python3 research/benchmarks/exp111_adaptive_inner_context.py \
            build/kephir2/kephir2_native_k75_cli

      - name: Validate result
        run: |
          python3 - <<'PY'
          import json
          d=json.load(open("exp111_results.json"))
          rows=d["rows"]
          assert len(rows) == 8
          assert rows[0]["label"] == "baseline-adaptive"
          assert all(r["raw_bytes"] == 211938580 for r in rows)
          assert all(r["sha_all_pass"] for r in rows)
          assert len(d["oracle"]["per_file"]) == 12
          assert d["oracle"]["archive_bytes"] <= rows[0]["archive_bytes"]
          print(
              "EXP111_VALIDATION_PASS",
              "BASE", rows[0]["archive_bytes"],
              "ORACLE", d["oracle"]["archive_bytes"],
              "GAIN", d["oracle"]["gain_vs_baseline"],
          )
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: exp111-adaptive-inner-context
          path: exp111_results.json
