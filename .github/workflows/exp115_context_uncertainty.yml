name: KEPHIR 2 EXP-115 Context Uncertainty Diagnostic

on:
  workflow_dispatch:
  push:
    branches:
      - research/exp115-context-uncertainty-resolver
    paths:
      - "src/kephir2/**"
      - ".github/workflows/exp115_context_uncertainty.yml"

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Build native KEPHIR
        run: |
          cmake -S src/kephir2 -B build/kephir2 -DCMAKE_BUILD_TYPE=Release
          cmake --build build/kephir2 --config Release --parallel

      - name: Native test suite
        run: ctest --test-dir build/kephir2 --output-on-failure

      - name: Download canonical Silesia
        run: |
          mkdir -p corpora/silesia
          curl -L --fail --retry 4 -o /tmp/silesia.zip \
            https://sun.aei.polsl.pl/~sdeor/corpus/silesia.zip
          echo "c240c17d6805fb8a0bde763f1b94cd99  /tmp/silesia.zip" | md5sum -c -
          unzip -q /tmp/silesia.zip -d corpora/silesia

      - name: Measure native context decisions
        run: |
          for f in dickens mozilla mr nci ooffice osdb reymont samba sao webster x-ray xml; do
            echo "EXP115_BEGIN=$f"
            build/kephir2/kephir2_context_policy_cli "corpora/silesia/$f"
            echo "EXP115_END=$f"
          done
