name: KSV-24 H3 Residual Mapping Selector

on:
  workflow_dispatch:
  pull_request:
    branches: ["research/khepri-stream-codec"]
    paths:
      - ".github/workflows/ksv24_residual_mapping_selector.yml"
      - "research/video/experiments/ksv24_residual_mapping_selector.py"
      - "research/video/experiments/ksv20_h3_refinement.py"
      - "research/video/experiments/ksv17_dense_integer_motion.py"
      - "research/video/experiments/ksv13_natural_radius_sweep.py"
      - "make_exp40_source.py"
  push:
    branches: ["feature/aurora-media-ksv24-residual-mapping-selector"]
    paths:
      - ".github/workflows/ksv24_residual_mapping_selector.yml"
      - "research/video/experiments/ksv24_residual_mapping_selector.py"

jobs:
  ksv24:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - name: Install
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential ffmpeg curl python3-numpy

      - name: Build optimized byte-identical KHEPRI EXP-40
        run: |
          cat source_parts/src_gz_*.b64 | base64 -d | gunzip > KEPHIR_2_EXP23_BASE.cpp
          python3 make_exp26_source.py
          python3 make_exp27_source.py
          python3 make_exp31_source.py
          python3 make_exp33_source.py
          python3 make_exp37_source.py
          python3 make_exp40_source.py
          g++ -O3 -march=native -mtune=native -std=c++20 -DNDEBUG             -DNO_INTERNAL_VERIFY             -DK2_ADAPT_MODE=9 -DK2_LAZY_MODE=1 -DK2_PSG_MODE=3             -DK2_DIST_TOPO_MODE=8 -DK2_DUAL_MATCH_MODE=1             -DK2_SHARED_MATCH_CACHE_MODE=1 -pthread             KEPHIR_2_EXP40_SHARED_MATCH_CACHE.cpp -o kephir40

      - name: Download Xiph natural video corpus
        run: |
          mkdir -p natural_sources
          curl -L --fail --retry 4 -o natural_sources/container.y4m             https://media.xiph.org/video/derf/y4m/container_cif.y4m
          curl -L --fail --retry 4 -o natural_sources/coastguard.y4m             https://media.xiph.org/video/derf/y4m/coastguard_cif.y4m
          curl -L --fail --retry 4 -o natural_sources/mobile.y4m             https://media.xiph.org/video/derf/y4m/mobile_cif.y4m
          curl -L --fail --retry 4 -o natural_sources/football.y4m             https://media.xiph.org/video/derf/y4m/football_cif.y4m
          curl -L --fail --retry 4 -o natural_sources/stefan.y4m             https://media.xiph.org/video/derf/y4m/stefan_sif.y4m

      - name: Prepare deterministic 60-frame corpus
        run: |
          mkdir -p natural_raw
          ffmpeg -hide_banner -loglevel error -y -i natural_sources/container.y4m             -frames:v 60 -pix_fmt yuv420p -f rawvideo natural_raw/container.yuv
          ffmpeg -hide_banner -loglevel error -y -i natural_sources/coastguard.y4m             -frames:v 60 -pix_fmt yuv420p -f rawvideo natural_raw/coastguard.yuv
          ffmpeg -hide_banner -loglevel error -y -i natural_sources/mobile.y4m             -frames:v 60 -pix_fmt yuv420p -f rawvideo natural_raw/mobile.yuv
          ffmpeg -hide_banner -loglevel error -y -i natural_sources/football.y4m             -frames:v 60 -pix_fmt yuv420p -f rawvideo natural_raw/football.yuv
          ffmpeg -hide_banner -loglevel error -y -i natural_sources/stefan.y4m             -frames:v 60 -pix_fmt yuv420p -f rawvideo natural_raw/stefan.yuv

      - name: Run KSV-24 selector
        env:
          PYTHONPATH: research/video/lab:research/video/experiments:research/backend
        run: |
          python3 research/video/experiments/ksv24_residual_mapping_selector.py             --kephir ./kephir40             --clip container:natural_raw/container.yuv:352:288:30:1             --clip coastguard:natural_raw/coastguard.yuv:352:288:30:1             --clip mobile:natural_raw/mobile.yuv:352:288:30:1             --clip football:natural_raw/football.yuv:352:288:30:1             --clip stefan:natural_raw/stefan.yuv:352:240:30:1             | tee ksv24.log

      - name: Validate KSV-24
        run: |
          grep -q "KSV24_RESIDUAL_MAPPING_SELECTOR_PASS" ksv24.log
          python3 - <<'PY' | tee ksv24_summary.txt
          import json
          from pathlib import Path
          r=json.loads(Path("results/video/ksv24_residual_mapping_selector/KSV24_RESULTS.json").read_text())
          assert r["production_candidate_duplicate_khepri_encodes"] == 0
          assert len(r["rows"]) == 5
          for row in r["rows"]:
              assert row["selected"]["sha_ok"]
              assert row["oracle"]["sha_ok"]
          a=r["aggregate"]
          print("KSV24_VALIDATION_PASS")
          print("BASELINE_BYTES",a["baseline_bytes"])
          print("SELECTED_BYTES",a["selected_bytes"])
          print("ORACLE_BYTES",a["oracle_bytes"])
          print("GAIN_RECOVERED_PCT",f'{a["gain_recovered_percent"]:.3f}')
          print("DELTA_VS_ORACLE_PCT",f'{a["delta_vs_oracle_percent"]:.6f}')
          print("MODE_MATCH_WINDOWS",a["mode_match_windows"])
          print("CHROMA_MATCH_WINDOWS",a["chroma_match_windows"])
          print("MAPPING_MATCH_WINDOWS",a["mapping_match_windows"])
          candidate=(
              a["gain_recovered_percent"] >= 95.0
              and a["delta_vs_oracle_percent"] <= 0.10
          )
          print("KSV24_PRODUCTION_CANDIDATE",str(candidate).lower())
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: ksv24-residual-mapping-selector
          path: |
            results/video/ksv24_residual_mapping_selector/KSV24_RESULTS.json
            ksv24.log
            ksv24_summary.txt
