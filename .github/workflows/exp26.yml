name: KEPHIR EXP-26 Band Sweep
on:
  workflow_dispatch:
  push:
    paths:
      - "make_exp26_source.py"
      - "exp26_band_sweep.py"
      - ".github/workflows/exp26.yml"
jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential unzip
      - name: Build EXP-26 modes
        run: |
          cat source_parts/src_gz_*.b64 | base64 -d | gunzip > KEPHIR_2_EXP23_BASE.cpp
          python3 make_exp26_source.py
          for M in 2 7 8 9; do
            g++ -O3 -std=c++20 -DNDEBUG -DNO_INTERNAL_VERIFY -DK2_ADAPT_MODE=$M -pthread KEPHIR_2_EXP26_BANDS.cpp -o kephir26_$M
          done
      - name: Download Silesia
        run: |
          curl -L --fail --retry 4 -o silesia.zip https://sun.aei.polsl.pl/~sdeor/corpus/silesia.zip
          echo "c240c17d6805fb8a0bde763f1b94cd99  silesia.zip" | md5sum -c -
          mkdir silesia
          unzip -q silesia.zip -d silesia
      - name: Run EXP-26 sweep
        run: python3 exp26_band_sweep.py
      - uses: actions/upload-artifact@v4
        with:
          name: exp26-band-results
          path: exp26_band_results.json
