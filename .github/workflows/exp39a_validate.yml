name: KEPHIR EXP-39A Validation
on:
  workflow_dispatch:
  push:
    paths:
      - "research/validation/exp39a_validate.py"
      - ".github/workflows/exp39a_validate.yml"
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential unzip
      - name: Build EXP-39A
        run: |
          cat source_parts/src_gz_*.b64 | base64 -d | gunzip > KEPHIR_2_EXP23_BASE.cpp
          python3 research/generators/general/make_exp26_source.py
          python3 research/generators/general/make_exp27_source.py
          python3 research/generators/general/make_exp31_source.py
          python3 research/generators/general/make_exp33_source.py
          python3 research/generators/general/make_exp37_source.py
          python3 research/generators/general/make_exp38_source.py
          python3 research/generators/general/make_exp39_source.py
          g++ -O3 -std=c++20 -DNDEBUG -DNO_INTERNAL_VERIFY -DK2_ADAPT_MODE=9 -DK2_LAZY_MODE=1 -DK2_PSG_MODE=3 -DK2_DIST_TOPO_MODE=8 -DK2_DUAL_MATCH_MODE=1 -DK2_FUSED_MATCH_MODE=1 -DK2_FUSED2_MODE=1 -pthread KEPHIR_2_EXP39_FUSED2.cpp -o kephir39
      - name: Silesia
        run: |
          curl -L --fail --retry 4 -o silesia.zip https://sun.aei.polsl.pl/~sdeor/corpus/silesia.zip
          echo "c240c17d6805fb8a0bde763f1b94cd99  silesia.zip" | md5sum -c -
          mkdir silesia
          unzip -q silesia.zip -d silesia
      - name: Validate
        run: python3 research/validation/exp39a_validate.py
      - uses: actions/upload-artifact@v4
        with:
          name: exp39a-validation
          path: exp39a_validation.json
