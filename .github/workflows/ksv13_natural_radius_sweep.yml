name: KSV-13 Natural Radius Sweep

on:
  workflow_dispatch:
  pull_request:
    branches: ["research/khepri-stream-codec"]
  push:
    branches: ["feature/aurora-media-ksv13-radius-sweep"]
    paths:
      - ".github/workflows/ksv13_natural_radius_sweep.yml"
      - "research/video/experiments/ksv13_natural_radius_sweep.py"
      - "research/video/lab/kstream_video_motion_control.py"
      - "research/video/lab/kstream_video_residual_symbols_v7.py"
      - "research/video/lab/kstream_video_baseline.py"

jobs:
  ksv13:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Install
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential ffmpeg curl python3-numpy

      - name: Build optimized byte-identical KHEPRI EXP-40
        run: |
          cat source_parts/src_gz_*.b64 | base64 -d | gunzip > KEPHIR_2_EXP23_BASE.cpp
          python3 make_exp26_source.py
          python3 make_exp27_source.py
          python3 make_exp31_source.py
          python3 make_exp33_source.py
          python3 make_exp37_source.py
          python3 make_exp40_source.py
          g++ -O3 -march=native -mtune=native -std=c++20 -DNDEBUG \
            -DNO_INTERNAL_VERIFY \
            -DK2_ADAPT_MODE=9 -DK2_LAZY_MODE=1 -DK2_PSG_MODE=3 \
            -DK2_DIST_TOPO_MODE=8 -DK2_DUAL_MATCH_MODE=1 \
            -DK2_SHARED_MATCH_CACHE_MODE=1 -pthread \
            KEPHIR_2_EXP40_SHARED_MATCH_CACHE.cpp -o kephir40

      - name: Download Xiph natural video corpus
        run: |
          mkdir -p natural_sources
          curl -L --fail --retry 4 -o natural_sources/container.y4m \
            https://media.xiph.org/video/derf/y4m/container_cif.y4m
          curl -L --fail --retry 4 -o natural_sources/coastguard.y4m \
            https://media.xiph.org/video/derf/y4m/coastguard_cif.y4m
          curl -L --fail --retry 4 -o natural_sources/mobile.y4m \
            https://media.xiph.org/video/derf/y4m/mobile_cif.y4m
          curl -L --fail --retry 4 -o natural_sources/football.y4m \
            https://media.xiph.org/video/derf/y4m/football_cif.y4m
          curl -L --fail --retry 4 -o natural_sources/stefan.y4m \
            https://media.xiph.org/video/derf/y4m/stefan_sif.y4m

      - name: Prepare deterministic 60-frame corpus
        run: |
          mkdir -p natural_raw
          ffmpeg -hide_banner -loglevel error -y -i natural_sources/container.y4m \
            -frames:v 60 -pix_fmt yuv420p -f rawvideo natural_raw/container.yuv
          ffmpeg -hide_banner -loglevel error -y -i natural_sources/coastguard.y4m \
            -frames:v 60 -pix_fmt yuv420p -f rawvideo natural_raw/coastguard.yuv
          ffmpeg -hide_banner -loglevel error -y -i natural_sources/mobile.y4m \
            -frames:v 60 -pix_fmt yuv420p -f rawvideo natural_raw/mobile.yuv
          ffmpeg -hide_banner -loglevel error -y -i natural_sources/football.y4m \
            -frames:v 60 -pix_fmt yuv420p -f rawvideo natural_raw/football.yuv
          ffmpeg -hide_banner -loglevel error -y -i natural_sources/stefan.y4m \
            -frames:v 60 -pix_fmt yuv420p -f rawvideo natural_raw/stefan.yuv

      - name: Run KSV-13 R4/R6 sweep
        env:
          PYTHONPATH: research/video/lab:research/video/experiments:research/backend
        run: |
          python3 research/video/experiments/ksv13_natural_radius_sweep.py \
            --kephir ./kephir40 \
            --clip container:natural_raw/container.yuv:352:288:30:1 \
            --clip coastguard:natural_raw/coastguard.yuv:352:288:30:1 \
            --clip mobile:natural_raw/mobile.yuv:352:288:30:1 \
            --clip football:natural_raw/football.yuv:352:288:30:1 \
            --clip stefan:natural_raw/stefan.yuv:352:240:30:1 \
            | tee ksv13_radius_sweep.log

      - name: Validate KSV-13 result
        run: |
          grep -q "KSV13_RADIUS_SWEEP_PASS" ksv13_radius_sweep.log
          python3 - <<'PY' | tee ksv13_summary.txt
          import json
          from pathlib import Path
          r=json.loads(Path("results/video/ksv13_radius_sweep/KSV13_RESULTS.json").read_text())
          assert len(r["rows"]) == 5
          for row in r["rows"]:
              for policy in ("r4","r6","oracle"):
                  assert row[policy]["sha_ok"]
          a=r["aggregate"]
          print("KSV13_VALIDATION_PASS")
          print("R4_BYTES",a["r4"]["bytes"])
          print("R6_BYTES",a["r6"]["bytes"])
          print("ORACLE_BYTES",a["oracle"]["bytes"])
          print("R6_DELTA_PCT",f'{a["r6_delta_vs_r4_percent"]:.6f}')
          print("ORACLE_DELTA_PCT",f'{a["oracle_delta_vs_r4_percent"]:.6f}')
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: ksv13-natural-radius-sweep
          path: |
            results/video/ksv13_radius_sweep/KSV13_RESULTS.json
            ksv13_radius_sweep.log
            ksv13_summary.txt
