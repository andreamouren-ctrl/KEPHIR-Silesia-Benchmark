name: KEPHIR 2 EXP-116B Volatility Gate Qualification

on:
  workflow_dispatch:
  push:
    branches:
      - research/exp116-structural-drift-gate
    paths:
      - "src/kephir2/**"
      - "research/benchmarks/exp113_native_context_router.py"
      - "research/benchmarks/exp115_external_corpus_qualification.py"
      - ".github/workflows/exp116b_volatility_gate_qualification.yml"
  pull_request:
    branches:
      - research/exp115-external-corpus-qualification
    paths:
      - "src/kephir2/**"
      - "research/benchmarks/exp113_native_context_router.py"
      - "research/benchmarks/exp115_external_corpus_qualification.py"
      - ".github/workflows/exp116b_volatility_gate_qualification.yml"

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 300

    steps:
      - uses: actions/checkout@v4

      - name: Build native KEPHIR
        run: |
          cmake -S src/kephir2 -B build/kephir2 -DCMAKE_BUILD_TYPE=Release
          cmake --build build/kephir2 --config Release --parallel

      - name: Native test suite
        run: ctest --test-dir build/kephir2 --output-on-failure

      - name: Materialize Silesia
        run: |
          mkdir -p corpora/silesia
          curl -L --fail --retry 4 -o /tmp/silesia.zip \
            https://sun.aei.polsl.pl/~sdeor/corpus/silesia.zip
          echo "c240c17d6805fb8a0bde763f1b94cd99  /tmp/silesia.zip" | md5sum -c -
          unzip -q /tmp/silesia.zip -d corpora/silesia
          test "$(find corpora/silesia -type f -printf '%s\n' | awk '{s+=$1} END {print s}')" -eq 211938580

      - name: Materialize pinned external corpora
        run: |
          set -euo pipefail
          MIRROR_SHA=c380ef9dc1dc62691757fdfeebdc2f85710e1e46
          git clone --no-checkout --filter=blob:none \
            https://github.com/pfalcon/canterbury-corpus.git /tmp/canterbury-corpus
          git -C /tmp/canterbury-corpus fetch --depth 1 origin "$MIRROR_SHA"
          git -C /tmp/canterbury-corpus checkout --detach "$MIRROR_SHA"
          cp -a /tmp/canterbury-corpus/canterbury corpora/canterbury
          cp -a /tmp/canterbury-corpus/calgary corpora/calgary
          cp -a /tmp/canterbury-corpus/large corpora/large
          rm -f corpora/canterbury/SHA1SUM corpora/calgary/SHA1SUM corpora/large/SHA1SUM

      - name: Qualify Silesia and synthetic holdout
        run: |
          python3 research/benchmarks/exp113_native_context_router.py \
            build/kephir2/kephir2_native_k75_cli
          mv exp113_results.json exp116b_core_results.json

      - name: Qualify external corpora
        run: |
          python3 research/benchmarks/exp115_external_corpus_qualification.py \
            build/kephir2/kephir2_native_k75_cli
          mv exp115_results.json exp116b_external_results.json

      - name: Validate candidate
        run: |
          python3 - <<'PY'
          import json
          c=json.load(open("exp116b_core_results.json"))
          e=json.load(open("exp116b_external_results.json"))
          s,h=c["datasets"]
          a=e["aggregate"]

          assert s["adaptive_bytes"] == 61677233
          assert s["regret_vs_oracle"] == 0
          assert len(s["harmful_selections"]) == 0
          assert h["regret_vs_oracle"] <= 1056
          assert len(h["harmful_selections"]) == 0

          assert len(a["harmful_selections"]) == 0
          assert a["gain_vs_baseline"] >= 50000
          assert a["regret_vs_oracle"] <= 5000

          print(
              "EXP116B_VALIDATION_PASS",
              "SILESIA",s["adaptive_bytes"],
              "SILESIA_RATIO",s["adaptive_ratio"],
              "SYNTH_REGRET",h["regret_vs_oracle"],
              "EXTERNAL_BASE",a["baseline_bytes"],
              "EXTERNAL_ADAPTIVE",a["adaptive_bytes"],
              "EXTERNAL_GAIN",a["gain_vs_baseline"],
              "EXTERNAL_REGRET",a["regret_vs_oracle"],
              "EXTERNAL_HARM",len(a["harmful_selections"]),
          )
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: exp116b-volatility-gate-qualification
          path: |
            exp116b_core_results.json
            exp116b_external_results.json
