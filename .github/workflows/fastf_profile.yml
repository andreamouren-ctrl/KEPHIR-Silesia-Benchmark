# FAST-F profiling rerun
name: KEPHIR FAST-F Profile
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/fastf_profile.yml"
jobs:
  profile:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential binutils unzip
      - name: Build FAST-D with gprof
        run: |
          cat engine/source_parts/src_gz_*.b64 | base64 -d | gunzip > KEPHIR_2_EXP23_BASE.cpp
          python3 research/generators/general/make_exp26_source.py
          python3 research/generators/general/make_exp27_source.py
          python3 research/generators/general/make_exp31_source.py
          python3 research/generators/general/make_exp33_source.py
          python3 research/generators/general/make_exp37_source.py
          python3 research/generators/general/make_exp38_source.py
          python3 research/generators/general/make_exp39_source.py
          K2_CHAIN_DEPTH_VALUE=24 K2_LAZY_DEPTH_VALUE=12 K2_PRED_MASK_VALUE=255 python3 research/generators/speed/make_speed1_source.py
          python3 research/generators/speed/make_fastd_source.py
          g++ -O3 -march=native -pg -std=c++20 -DNDEBUG -DNO_INTERNAL_VERIFY             -DK2_ADAPT_MODE=9 -DK2_LAZY_MODE=0 -DK2_PSG_MODE=0 -DK2_DIST_TOPO_MODE=0             -DK2_DUAL_MATCH_MODE=0 -DK2_FUSED_MATCH_MODE=0 -DK2_FUSED2_MODE=0             -pthread KEPHIR_SPEED_D_SOURCE.cpp -o kephir_fastd_profile
      - name: Silesia
        run: |
          curl -L --fail --retry 4 -o silesia.zip https://sun.aei.polsl.pl/~sdeor/corpus/silesia.zip
          echo "c240c17d6805fb8a0bde763f1b94cd99  silesia.zip" | md5sum -c -
          mkdir silesia
          unzip -q silesia.zip -d silesia
      - name: Profile difficult file
        run: |
          rm -f gmon.out
          ./kephir_fastd_profile cp silesia/mozilla mozilla.aur 1 6.55 9.42 1.20
          gprof ./kephir_fastd_profile gmon.out > fastf_gprof.txt
          echo "===== FLAT PROFILE TOP ====="
          sed -n '1,80p' fastf_gprof.txt
      - uses: actions/upload-artifact@v4
        with:
          name: fastf-profile
          path: fastf_gprof.txt
