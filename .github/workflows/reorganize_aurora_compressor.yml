name: Reorganize AURORA Compressor branch
on:
  push:
    paths:
      - "tools/maintenance/reorganize_file_project.py"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  reorganize:
    if: github.ref == 'refs/heads/project/aurora-compressor'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reorganize repository
        run: python3 tools/maintenance/reorganize_file_project.py
      - name: Verify root cleanliness and references
        run: |
          python3 - <<'PY'
          from pathlib import Path
          bad=[p.name for p in Path('.').glob('*.py')]
          print("ROOT_PY", bad)
          if bad:
              raise SystemExit("Unclassified Python files remain at repository root: "+", ".join(bad))
          PY
          git diff --check
      - name: Commit migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No migration changes"
            exit 0
          fi
          git commit -m "Organize AURORA Compressor project tree"
          git push origin HEAD:project/aurora-compressor
