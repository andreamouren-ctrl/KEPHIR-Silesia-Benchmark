name: AURORA Canonical Audio Restore

on:
  workflow_dispatch:
  pull_request:
    branches: ["research/khepri-stream-codec"]
  push:
    branches: ["fix/aurora-media-audio-full256-tail16"]
    paths:
      - ".github/workflows/aurora_audio_canonical_restore.yml"
      - "research/audio/lab/kstream_kmrl_lab.py"
      - "src/python/reference/aurora_media_codec_bridge.py"
      - "benchmarks/major_codecs/benchmark_audio_packet_horizon_v03.py"

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Install
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential ffmpeg curl python3-numpy

      - name: Build EXP-37A
        run: |
          cat source_parts/src_gz_*.b64 | base64 -d | gunzip > KEPHIR_2_EXP23_BASE.cpp
          python3 make_exp26_source.py
          python3 make_exp27_source.py
          python3 make_exp31_source.py
          python3 make_exp33_source.py
          python3 make_exp37_source.py
          g++ -O3 -std=c++20 -DNDEBUG -DNO_INTERNAL_VERIFY \
            -DK2_ADAPT_MODE=9 -DK2_LAZY_MODE=1 -DK2_PSG_MODE=3 \
            -DK2_DIST_TOPO_MODE=8 -DK2_DUAL_MATCH_MODE=1 -pthread \
            KEPHIR_2_EXP37_DUAL_MATCH.cpp -o kephir37

      - name: Prepare Sintel audio
        run: |
          curl -L --fail --retry 4 -o sintel_audio.flac \
            https://media.xiph.org/sintel/sintel_trailer-audio.flac
          ffmpeg -hide_banner -loglevel error -y \
            -i sintel_audio.flac -ac 2 -ar 48000 -sample_fmt s16 \
            -f s16le sintel_audio.raw

      - name: Validate explicit TAIL16 frontend roundtrip
        env:
          PYTHONPATH: src/python/reference:research/audio/lab:research/audio/experiments:research/backend
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          import kstream_kmrl_lab as lab
          src=Path("sintel_audio.raw")
          enc=Path("tail16.front")
          dec=Path("tail16.restored.raw")
          lab.encode_file(src,enc,2,48000,20,4)
          lab.decode_file(enc,dec)
          assert hashlib.sha256(src.read_bytes()).digest()==hashlib.sha256(dec.read_bytes()).digest()
          assert enc.read_bytes()[:4] == lab.MAGIC
          print("KMRL_FULL256_TAIL16_ROUNDTRIP_PASS", enc.stat().st_size)
          PY

      - name: Run recovery horizon benchmark
        env:
          PYTHONPATH: src/python/reference:research/audio/lab:research/audio/experiments:research/video/lab:research/video/experiments:research/backend
        run: |
          python3 benchmarks/major_codecs/benchmark_audio_packet_horizon_v03.py \
            --audio sintel_audio.raw --kephir ./kephir37 | tee canonical_audio_horizon.txt

      - name: Validate canonical result
        run: |
          python3 - <<'PY' | tee canonical_audio_summary.txt
          import json
          from pathlib import Path
          r=json.loads(Path("results/audio/packet_horizon_v03/results.json").read_text())
          rows={x["packet_ms"]:x for x in r["rows"]}
          for x in rows.values():
              assert x["sha_ok"]
          v=rows[2000]
          print("CANONICAL_AUDIO_2000MS_BYTES",v["bytes"])
          print("CANONICAL_AUDIO_2000MS_RATIO",v["ratio_percent"])
          print("CANONICAL_AUDIO_2000MS_ENCODE_S",v["encode_seconds"])
          print("CANONICAL_AUDIO_2000MS_DECODE_S",v["decode_seconds"])
          print("HISTORICAL_REFERENCE_BYTES",5546958)
          print("DELTA_VS_HISTORICAL",v["bytes"]-5546958)
          print("AURORA_CANONICAL_AUDIO_RESTORE_PASS")
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: aurora-canonical-audio-restore
          path: |
            results/audio/packet_horizon_v03/results.json
            canonical_audio_horizon.txt
            canonical_audio_summary.txt
