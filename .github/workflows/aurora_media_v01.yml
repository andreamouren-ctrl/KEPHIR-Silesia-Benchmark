name: AURORA Media v0.1 End-to-End

on:
  workflow_dispatch:
  push:
    branches:
      - "research/khepri-stream-codec"
    paths:
      - "src/python/reference/**"
      - "research/audio/**"
      - "research/video/**"
      - "tests/python/test_aurora_media_end_to_end.py"
      - ".github/workflows/aurora_media_v01.yml"

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential python3-numpy

      - name: Build KHEPRI EXP-37A
        run: |
          cat source_parts/src_gz_*.b64 | base64 -d | gunzip > KEPHIR_2_EXP23_BASE.cpp
          python3 make_exp26_source.py
          python3 make_exp27_source.py
          python3 make_exp31_source.py
          python3 make_exp33_source.py
          python3 make_exp37_source.py
          g++ -O3 -std=c++20 -DNDEBUG -DNO_INTERNAL_VERIFY \
            -DK2_ADAPT_MODE=9 -DK2_LAZY_MODE=1 -DK2_PSG_MODE=3 -DK2_DIST_TOPO_MODE=8 \
            -DK2_DUAL_MATCH_MODE=1 -pthread KEPHIR_2_EXP37_DUAL_MATCH.cpp -o kephir37

      - name: Compile canonical Python modules
        env:
          PYTHONPATH: src/python/reference:research/audio/lab:research/audio/experiments:research/video/lab:research/video/experiments:research/backend
        run: |
          python3 -m py_compile \
            src/python/reference/aurora_media_container.py \
            src/python/reference/aurora_media_codec_bridge.py \
            src/python/reference/aurora_media_pipeline.py \
            src/python/reference/aurora_media_converter.py \
            src/python/reference/aurora_media_session_reference.py \
            src/python/reference/aurora_stream_protocol.py \
            tests/python/test_aurora_media_end_to_end.py

      - name: Run canonical end-to-end backend test
        env:
          PYTHONPATH: src/python/reference:research/audio/lab:research/audio/experiments:research/video/lab:research/video/experiments:research/backend
        run: |
          python3 tests/python/test_aurora_media_end_to_end.py --kephir ./kephir37

      - uses: actions/upload-artifact@v4
        with:
          name: aurora-media-v01-test-results
          path: results/backend/AURORA_MEDIA_V01_TEST_RESULTS.json
