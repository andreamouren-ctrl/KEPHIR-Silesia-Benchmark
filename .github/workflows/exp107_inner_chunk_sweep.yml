name: KEPHIR 2 EXP-107 Inner Chunk Sweep

on:
  workflow_dispatch:
  push:
    branches:
      - development/kephir-2-core
    paths:
      - "research/benchmarks/exp107_inner_chunk_sweep.py"
      - ".github/workflows/exp107_inner_chunk_sweep.yml"

jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4

      - name: Generate EXP-37 source
        run: |
          cat engine/source_parts/src_gz_*.b64 | base64 -d | gunzip > KEPHIR_2_EXP23_BASE.cpp
          python3 research/generators/general/make_exp26_source.py
          python3 research/generators/general/make_exp27_source.py
          python3 research/generators/general/make_exp31_source.py
          python3 research/generators/general/make_exp33_source.py
          python3 research/generators/general/make_exp37_source.py

      - name: Build chunk-size variants
        run: |
          for K in 256 512 1024 2048; do
            g++ -O3 -std=c++20 -DNDEBUG -DNO_INTERNAL_VERIFY               -DK2_ADAPT_MODE=9 -DK2_LAZY_MODE=1 -DK2_PSG_MODE=3               -DK2_DIST_TOPO_MODE=8 -DK2_DUAL_MATCH_MODE=1               -DK2_CHUNK_KIB=$K               -pthread KEPHIR_2_EXP37_DUAL_MATCH.cpp -o kephir37_$K
            chmod +x kephir37_$K
          done

      - name: Download canonical Silesia
        run: |
          mkdir -p corpora/silesia
          curl -L --fail --retry 4 -o /tmp/silesia.zip             https://sun.aei.polsl.pl/~sdeor/corpus/silesia.zip
          echo "c240c17d6805fb8a0bde763f1b94cd99  /tmp/silesia.zip" | md5sum -c -
          unzip -q /tmp/silesia.zip -d corpora/silesia

      - name: Run EXP-107
        run: |
          python3 research/benchmarks/exp107_inner_chunk_sweep.py

      - uses: actions/upload-artifact@v4
        with:
          name: exp107-inner-chunk-sweep
          path: exp107_results.json
