name: KEPHIR EXP-34 Lattice Distance Transform
on:
  workflow_dispatch:
  push:
    paths:
      - "research/generators/general/make_exp34_source.py"
      - "research/experiments/exp34_sweep.py"
      - ".github/workflows/exp34.yml"
jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential unzip
      - name: Build modes
        run: |
          cat source_parts/src_gz_*.b64 | base64 -d | gunzip > KEPHIR_2_EXP23_BASE.cpp
          python3 research/generators/general/make_exp26_source.py
          python3 research/generators/general/make_exp27_source.py
          python3 research/generators/general/make_exp31_source.py
          python3 research/generators/general/make_exp33_source.py
          python3 research/generators/general/make_exp34_source.py
          for M in 0 1 2 3; do
            g++ -O3 -std=c++20 -DNDEBUG -DNO_INTERNAL_VERIFY -DK2_ADAPT_MODE=9 -DK2_LAZY_MODE=1 -DK2_PSG_MODE=3 -DK2_DIST_TOPO_MODE=8 -DK2_LDT_MODE=$M -pthread KEPHIR_2_EXP34_LDT.cpp -o kephir34_$M
          done
      - name: Silesia
        run: |
          curl -L --fail --retry 4 -o silesia.zip https://sun.aei.polsl.pl/~sdeor/corpus/silesia.zip
          echo "c240c17d6805fb8a0bde763f1b94cd99  silesia.zip" | md5sum -c -
          mkdir silesia
          unzip -q silesia.zip -d silesia
      - name: Run EXP-34
        run: python3 research/experiments/exp34_sweep.py
      - uses: actions/upload-artifact@v4
        with:
          name: exp34-results
          path: exp34_results.json
