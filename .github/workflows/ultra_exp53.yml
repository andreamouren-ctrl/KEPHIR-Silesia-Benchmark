name: AURORA ULTRA EXP-53 Predictive Literal Cost
on:
  workflow_dispatch:
  pull_request:
    branches:
      - project/aurora-compressor
    paths:
      - "research/generators/general/make_exp53_ultra_source.py"
      - ".github/workflows/ultra_exp53.yml"

jobs:
  ultra-exp53:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - name: Install
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential unzip
      - name: Build EXP-53 backend
        run: |
          cat engine/source_parts/src_gz_*.b64 | base64 -d | gunzip > KEPHIR_2_EXP23_BASE.cpp
          python3 research/generators/general/make_exp26_source.py
          python3 research/generators/general/make_exp27_source.py
          python3 research/generators/general/make_exp31_source.py
          python3 research/generators/general/make_exp33_source.py
          python3 research/generators/general/make_exp37_source.py
          python3 research/generators/general/make_exp53_ultra_source.py
          g++ -O3 -std=c++20 -DNDEBUG -DNO_INTERNAL_VERIFY             -DK2_ADAPT_MODE=9 -DK2_LAZY_MODE=1 -DK2_PSG_MODE=5             -DK2_DIST_TOPO_MODE=8 -DK2_DUAL_MATCH_MODE=1             -pthread KEPHIR_2_EXP53_ULTRA_PSG.cpp -o kephir37
      - name: Download canonical Silesia
        run: |
          curl -L --fail --retry 4 -o silesia.zip https://sun.aei.polsl.pl/~sdeor/corpus/silesia.zip
          echo "c240c17d6805fb8a0bde763f1b94cd99  silesia.zip" | md5sum -c -
          mkdir silesia
          unzip -q silesia.zip -d silesia
      - name: Run EXP-48 router on EXP-53 backend
        run: python3 research/routers/exp48_router.py
      - name: Validate ULTRA result
        run: |
          python3 - <<'PY'
          import json
          s=json.load(open("exp44_results.json"))["summary"]
          assert s["raw"] == 211938580, s
          assert s["sha_all"] is True, s
          s["baseline_exp48_size"]=63201140
          s["delta_bytes"]=s["size"]-63201140
          s["improvement_bytes"]=63201140-s["size"]
          s["improvement_pct"]=(63201140-s["size"])/63201140*100.0
          print(json.dumps(s,indent=2))
          open("exp53_results.json","w").write(json.dumps({"summary":s},indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: ultra-exp53-results
          path: exp53_results.json
