name: AURORA Video GPU D3D12

on:
  workflow_dispatch:
  push:
    branches: ["research/khepri-stream-codec"]
    paths:
      - "src/cpp/aurora_media/AuroraVideoCompute*"
      - "src/cpp/aurora_media/AuroraVideoMotion*"
      - "src/cpp/aurora_media/shaders/**"
      - "tests/cpp/test_aurora_video_gpu_d3d12.cpp"
      - ".github/workflows/aurora_video_gpu_d3d12.yml"

jobs:
  d3d12:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Build D3D12 compute equivalence test
        shell: cmd
        run: >
          cl /nologo /EHsc /std:c++20 /O2
          /DAURORA_SHADER_DIR=L\"src/cpp/aurora_media/shaders\"
          src/cpp/aurora_media/AuroraVideoMotion.cpp
          src/cpp/aurora_media/AuroraVideoCompute.cpp
          src/cpp/aurora_media/AuroraVideoComputeD3D12.cpp
          tests/cpp/test_aurora_video_gpu_d3d12.cpp
          /Isrc/cpp/aurora_media
          /Fe:aurora_video_gpu_d3d12_test.exe
          d3d12.lib dxgi.lib d3dcompiler.lib

      - name: Run CPU vs D3D12 WARP equivalence
        shell: cmd
        run: aurora_video_gpu_d3d12_test.exe

# GPU equivalence gate
