name: AURORA ULTRA EXP-54 Adaptive PSG
on:
  workflow_dispatch:
  pull_request:
    branches:
      - project/aurora-compressor
    paths:
      - "research/generators/general/make_exp53_ultra_source.py"
      - "research/routers/exp54_ultra_adaptive_psg.py"
      - ".github/workflows/ultra_exp54.yml"

jobs:
  ultra-exp54:
    runs-on: ubuntu-latest
    timeout-minutes: 420
    steps:
      - uses: actions/checkout@v4
      - name: Install
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential unzip
      - name: Build EXP-48 and EXP-53 backends
        run: |
          cat engine/source_parts/src_gz_*.b64 | base64 -d | gunzip > KEPHIR_2_EXP23_BASE.cpp
          python3 research/generators/general/make_exp26_source.py
          python3 research/generators/general/make_exp27_source.py
          python3 research/generators/general/make_exp31_source.py
          python3 research/generators/general/make_exp33_source.py
          python3 research/generators/general/make_exp37_source.py
          g++ -O3 -std=c++20 -DNDEBUG -DNO_INTERNAL_VERIFY             -DK2_ADAPT_MODE=9 -DK2_LAZY_MODE=1 -DK2_PSG_MODE=3             -DK2_DIST_TOPO_MODE=8 -DK2_DUAL_MATCH_MODE=1             -pthread KEPHIR_2_EXP37_DUAL_MATCH.cpp -o kephir37
          python3 research/generators/general/make_exp53_ultra_source.py
          g++ -O3 -std=c++20 -DNDEBUG -DNO_INTERNAL_VERIFY             -DK2_ADAPT_MODE=9 -DK2_LAZY_MODE=1 -DK2_PSG_MODE=5             -DK2_DIST_TOPO_MODE=8 -DK2_DUAL_MATCH_MODE=1             -pthread KEPHIR_2_EXP53_ULTRA_PSG.cpp -o kephir53
      - name: Download canonical Silesia
        run: |
          curl -L --fail --retry 4 -o silesia.zip https://sun.aei.polsl.pl/~sdeor/corpus/silesia.zip
          echo "c240c17d6805fb8a0bde763f1b94cd99  silesia.zip" | md5sum -c -
          mkdir silesia
          unzip -q silesia.zip -d silesia
      - name: Run ULTRA EXP-54
        run: python3 research/routers/exp54_ultra_adaptive_psg.py
      - name: Validate ULTRA result
        run: |
          python3 - <<'PY'
          import json
          s=json.load(open("exp54_results.json"))["summary"]
          assert s["raw"] == 211938580, s
          assert s["sha_all"] is True, s
          print(json.dumps(s,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: ultra-exp54-results
          path: exp54_results.json
