name: KEPHIR 2 EXP-109 Production Context Sweep

on:
  workflow_dispatch:
  push:
    branches:
      - development/kephir-2-core
    paths:
      - "research/benchmarks/exp109_production_context_sweep.py"
      - ".github/workflows/exp109_production_context_sweep.yml"

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 300

    steps:
      - uses: actions/checkout@v4

      - name: Build native KEPHIR
        run: |
          cmake -S src/kephir2 -B build/kephir2 -DCMAKE_BUILD_TYPE=Release
          cmake --build build/kephir2 --config Release --parallel

      - name: Native test suite
        run: ctest --test-dir build/kephir2 --output-on-failure

      - name: Download canonical Silesia
        run: |
          mkdir -p corpora/silesia
          curl -L --fail --retry 4 -o /tmp/silesia.zip             https://sun.aei.polsl.pl/~sdeor/corpus/silesia.zip
          echo "c240c17d6805fb8a0bde763f1b94cd99  /tmp/silesia.zip" | md5sum -c -
          unzip -q /tmp/silesia.zip -d corpora/silesia
          test "$(find corpora/silesia -type f -printf '%s\n' | awk '{s+=$1} END {print s}')" -eq 211938580

      - name: Run EXP-109
        run: |
          python3 research/benchmarks/exp109_production_context_sweep.py             build/kephir2/kephir2_native_k75_cli

      - name: Validate result
        run: |
          python3 - <<'PY'
          import json
          d=json.load(open("exp109_results.json"))
          assert len(d["rows"]) == 5
          assert all(r["raw_bytes"] == 211938580 for r in d["rows"])
          assert all(r["sha_all_pass"] for r in d["rows"])
          print("EXP109_VALIDATION_PASS")
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: exp109-production-context-sweep
          path: exp109_results.json
