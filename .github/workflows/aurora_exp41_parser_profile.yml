name: AURORA EXP41 Parser Profile

on:
  workflow_dispatch:
  push:
    branches: ["feature/aurora-media-exp41-parser-profile"]
    paths:
      - ".github/workflows/aurora_exp41_parser_profile.yml"
      - "make_exp41_profile_source.py"
      - "benchmarks/major_codecs/aurora_exp41_parser_profile.cpp"
      - "make_exp40_source.py"
      - "src/cpp/aurora_media/AuroraVideoMotion.cpp"
      - "src/cpp/aurora_media/AuroraVideoResidual.cpp"

jobs:
  profile:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential

      - name: Generate EXP-41 profiling source
        run: |
          cat source_parts/src_gz_*.b64 | base64 -d | gunzip > KEPHIR_2_EXP23_BASE.cpp
          python3 make_exp26_source.py
          python3 make_exp27_source.py
          python3 make_exp31_source.py
          python3 make_exp33_source.py
          python3 make_exp37_source.py
          python3 make_exp40_source.py
          python3 make_exp41_profile_source.py

      - name: Build parser profiler
        run: |
          g++ -O3 -march=native -mtune=native -std=c++20 -DNDEBUG \
            -DNO_INTERNAL_VERIFY \
            -DK2_ADAPT_MODE=9 -DK2_LAZY_MODE=1 -DK2_PSG_MODE=3 \
            -DK2_DIST_TOPO_MODE=8 -DK2_DUAL_MATCH_MODE=1 \
            -DK2_SHARED_MATCH_CACHE_MODE=1 \
            -pthread -Wall -Wextra -Werror \
            src/cpp/aurora_media/AuroraVideoMotion.cpp \
            src/cpp/aurora_media/AuroraVideoResidual.cpp \
            benchmarks/major_codecs/aurora_exp41_parser_profile.cpp \
            -Isrc/cpp/aurora_media \
            -o exp41_profile

      - name: Run parser profile
        run: ./exp41_profile | tee exp41_parser_profile.txt

      - name: Validate profile
        run: |
          grep -q "AURORA_EXP41_PARSER_PROFILE_PASS" exp41_parser_profile.txt
          python3 - <<'PY' | tee exp41_parser_summary.txt
          import re
          from pathlib import Path

          line=next(
              x for x in Path("exp41_parser_profile.txt").read_text().splitlines()
              if x.startswith("AURORA_EXP41_PARSER_PROFILE_PASS ")
          )
          v=dict(re.findall(r"(\w+)=([^ ]+)",line))
          assert int(v["findbest_calls"]) > 0
          assert int(v["findpred_calls"]) > 0
          assert int(v["findbest_nodes"]) > 0
          assert int(v["findpred_nodes"]) > 0
          print("AURORA_EXP41_PROFILE_VALIDATION_PASS")
          for key in (
              "findbest_calls","findpred_calls",
              "findbest_nodes","findpred_nodes",
              "findbest_early_stops",
              "shared_cache_hits","shared_cache_misses",
              "predictive_match_computes",
              "predictive_scored_candidates",
              "cache_reuse_pct","predictive_compute_pct",
              "findbest_early_stop_pct",
          ):
              print(key,v[key])
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: aurora-exp41-parser-profile
          path: |
            exp41_parser_profile.txt
            exp41_parser_summary.txt
