name: KEPHIR EXP-48 Full Compressor Benchmark
on:
  workflow_dispatch:
  push:
    paths:
      - "exp48_competitor_benchmark.py"
      - ".github/workflows/exp48_benchmark.yml"
jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - name: Install compressors
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential unzip zip zstd xz-utils gzip bzip2 brotli lz4 p7zip-full
      - name: Build EXP-37A backend
        run: |
          cat source_parts/src_gz_*.b64 | base64 -d | gunzip > KEPHIR_2_EXP23_BASE.cpp
          python3 make_exp26_source.py
          python3 make_exp27_source.py
          python3 make_exp31_source.py
          python3 make_exp33_source.py
          python3 make_exp37_source.py
          g++ -O3 -std=c++20 -DNDEBUG -DNO_INTERNAL_VERIFY -DK2_ADAPT_MODE=9 -DK2_LAZY_MODE=1 -DK2_PSG_MODE=3 -DK2_DIST_TOPO_MODE=8 -DK2_DUAL_MATCH_MODE=1 -pthread KEPHIR_2_EXP37_DUAL_MATCH.cpp -o kephir37
      - name: Silesia
        run: |
          curl -L --fail --retry 4 -o silesia.zip https://sun.aei.polsl.pl/~sdeor/corpus/silesia.zip
          echo "c240c17d6805fb8a0bde763f1b94cd99  silesia.zip" | md5sum -c -
          mkdir silesia
          unzip -q silesia.zip -d silesia
      - name: Benchmark all
        run: python3 exp48_competitor_benchmark.py
      - uses: actions/upload-artifact@v4
        with:
          name: exp48-full-benchmark
          path: exp48_competitor_benchmark.json
