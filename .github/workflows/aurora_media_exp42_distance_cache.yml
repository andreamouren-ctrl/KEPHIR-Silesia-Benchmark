name: AURORA Media EXP42 Distance Cost Cache

on:
  workflow_dispatch:
  pull_request:
    branches: ["research/khepri-stream-codec"]

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Install
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential

      - name: Generate EXP-40 and EXP-42
        run: |
          cat source_parts/src_gz_*.b64 | base64 -d | gunzip > KEPHIR_2_EXP23_BASE.cpp
          python3 make_exp26_source.py
          python3 make_exp27_source.py
          python3 make_exp31_source.py
          python3 make_exp33_source.py
          python3 make_exp37_source.py
          python3 make_exp40_source.py
          python3 make_exp42_source.py

      - name: Build EXP-40 baseline
        run: |
          g++ -O3 -march=native -mtune=native -std=c++20 -DNDEBUG \
            -DNO_INTERNAL_VERIFY \
            -DK2_ADAPT_MODE=9 -DK2_LAZY_MODE=1 -DK2_PSG_MODE=3 \
            -DK2_DIST_TOPO_MODE=8 -DK2_DUAL_MATCH_MODE=1 \
            -DK2_SHARED_MATCH_CACHE_MODE=1 \
            -pthread -Wall -Wextra -Werror \
            src/cpp/aurora_media/AuroraKhepriExp40MemoryAdapter.cpp \
            src/cpp/aurora_media/AuroraVideoMotion.cpp \
            src/cpp/aurora_media/AuroraVideoResidual.cpp \
            benchmarks/major_codecs/aurora_khepri_exp42_backend_ab.cpp \
            -Isrc/cpp/aurora_media -o media_exp40

      - name: Build EXP-42 distance-cache
        run: |
          g++ -O3 -march=native -mtune=native -std=c++20 -DNDEBUG \
            -DNO_INTERNAL_VERIFY -DAURORA_KHEPRI_EXP42 \
            -DK2_ADAPT_MODE=9 -DK2_LAZY_MODE=1 -DK2_PSG_MODE=3 \
            -DK2_DIST_TOPO_MODE=8 -DK2_DUAL_MATCH_MODE=1 \
            -DK2_SHARED_MATCH_CACHE_MODE=1 -DK2_DIST_COST_CACHE_MODE=1 \
            -pthread -Wall -Wextra -Werror \
            src/cpp/aurora_media/AuroraKhepriExp42MemoryAdapter.cpp \
            src/cpp/aurora_media/AuroraVideoMotion.cpp \
            src/cpp/aurora_media/AuroraVideoResidual.cpp \
            benchmarks/major_codecs/aurora_khepri_exp42_backend_ab.cpp \
            -Isrc/cpp/aurora_media -o media_exp42

      - name: Run repeated alternating A/B
        run: |
          : > exp42_ab.txt
          for i in 1 2 3 4 5; do
            echo "=== ROUND $i ===" | tee -a exp42_ab.txt
            if [ $((i % 2)) -eq 1 ]; then
              ./media_exp40 | tee -a exp42_ab.txt
              ./media_exp42 | tee -a exp42_ab.txt
            else
              ./media_exp42 | tee -a exp42_ab.txt
              ./media_exp40 | tee -a exp42_ab.txt
            fi
          done

      - name: Validate byte identity and summarize
        run: |
          python3 - <<'PY' | tee exp42_summary.txt
          import re, statistics
          from pathlib import Path

          rows=[]
          for line in Path("exp42_ab.txt").read_text().splitlines():
              if line.startswith("AURORA_KHEPRI_MEDIA_BACKEND_PASS "):
                  rows.append(dict(re.findall(r"(\w+)=([^ ]+)",line)))

          groups={}
          for row in rows:
              groups.setdefault(row["backend"],[]).append(row)

          base=groups.get("EXP40_SHARED_CACHE",[])
          test=groups.get("EXP42_DISTANCE_COST_CACHE",[])
          if len(base)!=5 or len(test)!=5:
              raise SystemExit(f"expected 5 trials/backend, got {len(base)} and {len(test)}")

          ref=base[0]
          for row in base+test:
              for key in ("tiles","input_bytes","input_fingerprint","packed_bytes","payload_fingerprint"):
                  if row[key]!=ref[key]:
                      raise SystemExit(f"bitstream/input mismatch: {key}")

          def med(group,key):
              return statistics.median(float(x[key]) for x in group)

          b_enc=med(base,"encode_ms")
          t_enc=med(test,"encode_ms")
          b_dec=med(base,"decode_ms")
          t_dec=med(test,"decode_ms")

          print("AURORA_EXP42_EXACT_AB")
          print("BITSTREAM_IDENTITY=PASS")
          print(
              "encode_median",
              f"exp40_ms={b_enc:.6f}",
              f"exp42_ms={t_enc:.6f}",
              f"speedup_x={b_enc/t_enc:.3f}",
              f"time_reduction_pct={(1.0-t_enc/b_enc)*100.0:.2f}",
          )
          print(
              "decode_median",
              f"exp40_ms={b_dec:.6f}",
              f"exp42_ms={t_dec:.6f}",
              f"delta_pct={(t_dec/b_dec-1.0)*100.0:.2f}",
          )
          candidate=(t_enc <= b_enc*0.98 and t_dec <= b_dec*1.03)
          print("EXP42_PROMOTION_CANDIDATE",str(candidate).lower())
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: aurora-exp42-distance-cost-cache
          path: |
            exp42_ab.txt
            exp42_summary.txt
