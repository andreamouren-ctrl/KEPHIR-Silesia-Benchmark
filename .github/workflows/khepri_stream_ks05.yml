name: KHEPRI Stream KS-05 Predictor Topology

on:
  workflow_dispatch:
  push:
    branches:
      - "research/khepri-stream-codec"
    paths:
      - "streaming/ks05_predictor_topology_bench.py"
      - "streaming/kstream_kmrl_lab.py"
      - ".github/workflows/khepri_stream_ks05.yml"

jobs:
  ks05:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential ffmpeg curl

      - name: Build EXP-33H backend
        run: |
          cat source_parts/src_gz_*.b64 | base64 -d | gunzip > KEPHIR_2_EXP23_BASE.cpp
          python3 make_exp26_source.py
          python3 make_exp27_source.py
          python3 make_exp31_source.py
          python3 make_exp33_source.py
          g++ -O3 -std=c++20 -DNDEBUG -DNO_INTERNAL_VERIFY             -DK2_ADAPT_MODE=9 -DK2_LAZY_MODE=1 -DK2_PSG_MODE=3 -DK2_DIST_TOPO_MODE=8             -pthread KEPHIR_2_EXP33_DISTANCE_TOPOLOGY.cpp -o kephir33

      - name: Prepare benchmark PCM
        run: |
          curl -L --fail --retry 4             -o streaming/sintel_trailer_source.flac             https://media.xiph.org/sintel/sintel_trailer-audio.flac
          ffmpeg -hide_banner -loglevel error -y             -i streaming/sintel_trailer_source.flac             -ac 2 -ar 48000 -sample_fmt s16 -f s16le             streaming/ks05_source.raw

      - name: Run KS-05
        run: |
          python3 streaming/ks05_predictor_topology_bench.py             --raw streaming/ks05_source.raw             --kephir ./kephir33

      - uses: actions/upload-artifact@v4
        with:
          name: khepri-stream-ks05
          path: streaming/ks05_out/ks05_results.json
