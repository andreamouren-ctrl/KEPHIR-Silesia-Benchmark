name: KEPHIR EXP-24 Adaptive Sweep
on:
  workflow_dispatch:
  push:
    paths:
      - "research/experiments/exp24_adaptive_sweep.py"
      - ".github/workflows/exp24.yml"
jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential unzip
      - name: Rebuild EXP-24 source and compile four modes
        run: |
          cat engine/source_parts/src_gz_*.b64 | base64 -d | gunzip > KEPHIR_2_EXP23_BASE.cpp
          test "$(wc -c < KEPHIR_2_EXP23_BASE.cpp)" -eq 38695
          python3 research/generators/general/make_exp24_source.py
          for M in 0 1 2 3; do
            g++ -O3 -std=c++20 -DNDEBUG -DNO_INTERNAL_VERIFY -DK2_ADAPT_MODE=$M -pthread KEPHIR_2_EXP24_ADAPTIVE.cpp -o kephir24_$M
          done
      - name: Download Silesia
        run: |
          curl -L --fail --retry 4 -o silesia.zip https://sun.aei.polsl.pl/~sdeor/corpus/silesia.zip
          echo "c240c17d6805fb8a0bde763f1b94cd99  silesia.zip" | md5sum -c -
          mkdir silesia
          unzip -q silesia.zip -d silesia
      - name: Run adaptive sweep
        run: python3 research/experiments/exp24_adaptive_sweep.py
      - uses: actions/upload-artifact@v4
        with:
          name: exp24-adaptive-results
          path: exp24_adaptive_results.json
