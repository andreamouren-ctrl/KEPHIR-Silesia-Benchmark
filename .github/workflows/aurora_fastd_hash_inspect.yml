name: AURORA FAST-D Hash Inspect
on:
  workflow_dispatch:
  push:
    branches: ["research/khepri-stream-codec"]
    paths: [".github/workflows/aurora_fastd_hash_inspect.yml"]
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Generate FAST-D
        run: |
          cat source_parts/src_gz_*.b64 | base64 -d | gunzip > KEPHIR_2_EXP23_BASE.cpp
          python3 make_exp26_source.py
          python3 make_exp27_source.py
          python3 make_exp31_source.py
          python3 make_exp33_source.py
          python3 make_exp37_source.py
          python3 make_exp38_source.py
          python3 make_exp39_source.py
          python3 make_fastd_video_profile_source.py streaming4k
      - name: Print hash helpers
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path("KEPHIR_SPEED_D_SOURCE.cpp").read_text()
          for key in ["auto h4=", "uint32_t h4", "auto slot=", "uint32_t slot"]:
              p=s.find(key)
              if p>=0:
                  a=max(0,s.rfind("\n",0,p)-1000)
                  b=min(len(s),s.find("\n",p)+2500)
                  print("HASH_INSPECT_BEGIN",key)
                  print(s[a:b])
                  print("HASH_INSPECT_END")
          PY
