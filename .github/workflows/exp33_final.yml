name: KEPHIR EXP-33 Final Topology Sweep
on:
  workflow_dispatch:
  push:
    paths:
      - "exp33_final_sweep.py"
      - ".github/workflows/exp33_final.yml"
jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential unzip
      - name: Build modes
        run: |
          cat source_parts/src_gz_*.b64 | base64 -d | gunzip > KEPHIR_2_EXP23_BASE.cpp
          python3 make_exp26_source.py
          python3 make_exp27_source.py
          python3 make_exp31_source.py
          python3 make_exp33_source.py
          for M in 5 7 8 9; do
            g++ -O3 -std=c++20 -DNDEBUG -DNO_INTERNAL_VERIFY -DK2_ADAPT_MODE=9 -DK2_LAZY_MODE=1 -DK2_PSG_MODE=3 -DK2_DIST_TOPO_MODE=$M -pthread KEPHIR_2_EXP33_DISTANCE_TOPOLOGY.cpp -o kephir33f_$M
          done
      - name: Silesia
        run: |
          curl -L --fail --retry 4 -o silesia.zip https://sun.aei.polsl.pl/~sdeor/corpus/silesia.zip
          echo "c240c17d6805fb8a0bde763f1b94cd99  silesia.zip" | md5sum -c -
          mkdir silesia
          unzip -q silesia.zip -d silesia
      - name: Run final sweep
        run: python3 exp33_final_sweep.py
      - uses: actions/upload-artifact@v4
        with:
          name: exp33-final-results
          path: exp33_final_results.json
