name: AURORA Media EXP40 Exact Cache

on:
  workflow_dispatch:
  pull_request:
    branches: ["research/khepri-stream-codec"]
  push:
    branches: ["feature/aurora-media-exp40-shared-match-cache"]
    paths:
      - ".github/workflows/aurora_media_exp40_backend.yml"
      - "make_exp40_source.py"
      - "src/cpp/aurora_media/AuroraKhepriExp40MemoryAdapter.*"
      - "benchmarks/major_codecs/aurora_khepri_exp40_backend_ab.cpp"

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Install
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential

      - name: Generate EXP-37A and EXP-40 exact-cache source
        run: |
          cat source_parts/src_gz_*.b64 | base64 -d | gunzip > KEPHIR_2_EXP23_BASE.cpp
          python3 make_exp26_source.py
          python3 make_exp27_source.py
          python3 make_exp31_source.py
          python3 make_exp33_source.py
          python3 make_exp37_source.py
          python3 make_exp40_source.py

      - name: Build EXP-37A baseline
        run: |
          g++ -O3 -march=native -mtune=native -std=c++20 -DNDEBUG \
            -DNO_INTERNAL_VERIFY \
            -DK2_ADAPT_MODE=9 -DK2_LAZY_MODE=1 -DK2_PSG_MODE=3 \
            -DK2_DIST_TOPO_MODE=8 -DK2_DUAL_MATCH_MODE=1 \
            -pthread -Wall -Wextra -Werror \
            src/cpp/aurora_media/AuroraKhepriExp37MemoryAdapter.cpp \
            src/cpp/aurora_media/AuroraVideoMotion.cpp \
            src/cpp/aurora_media/AuroraVideoResidual.cpp \
            benchmarks/major_codecs/aurora_khepri_exp40_backend_ab.cpp \
            -Isrc/cpp/aurora_media -o media_exp37

      - name: Build EXP-40 exact shared-cache implementation
        run: |
          g++ -O3 -march=native -mtune=native -std=c++20 -DNDEBUG \
            -DNO_INTERNAL_VERIFY -DAURORA_KHEPRI_EXP40 \
            -DK2_ADAPT_MODE=9 -DK2_LAZY_MODE=1 -DK2_PSG_MODE=3 \
            -DK2_DIST_TOPO_MODE=8 -DK2_DUAL_MATCH_MODE=1 \
            -DK2_SHARED_MATCH_CACHE_MODE=1 \
            -pthread -Wall -Wextra -Werror \
            src/cpp/aurora_media/AuroraKhepriExp40MemoryAdapter.cpp \
            src/cpp/aurora_media/AuroraVideoMotion.cpp \
            src/cpp/aurora_media/AuroraVideoResidual.cpp \
            benchmarks/major_codecs/aurora_khepri_exp40_backend_ab.cpp \
            -Isrc/cpp/aurora_media -o media_exp40

      - name: Run backend A/B
        run: |
          echo "=== EXP37 ===" | tee exp40_backend_ab.txt
          ./media_exp37 | tee -a exp40_backend_ab.txt
          echo "=== EXP40 ===" | tee -a exp40_backend_ab.txt
          ./media_exp40 | tee -a exp40_backend_ab.txt

      - name: Validate byte identity and summarize
        run: |
          python3 - <<'PY' | tee exp40_backend_summary.txt
          import re
          from pathlib import Path

          rows=[]
          for line in Path("exp40_backend_ab.txt").read_text().splitlines():
              if line.startswith("AURORA_KHEPRI_MEDIA_BACKEND_PASS "):
                  rows.append(dict(re.findall(r"(\w+)=([^ ]+)",line)))

          if len(rows)!=2:
              raise SystemExit("expected EXP37 and EXP40 rows")
          base,cached=rows
          if base["backend"]!="EXP37_DUAL" or cached["backend"]!="EXP40_SHARED_CACHE":
              raise SystemExit("backend order mismatch")

          for key in ("tiles","input_bytes","input_fingerprint"):
              if base[key]!=cached[key]:
                  raise SystemExit(f"input mismatch: {key}")

          exact=(
              base["packed_bytes"]==cached["packed_bytes"] and
              base["payload_fingerprint"]==cached["payload_fingerprint"]
          )
          if not exact:
              raise SystemExit("EXP40 is not byte-identical to EXP37")

          b_enc=float(base["encode_ms"])
          c_enc=float(cached["encode_ms"])
          b_dec=float(base["decode_ms"])
          c_dec=float(cached["decode_ms"])
          speed=b_enc/c_enc
          enc_reduction=(1.0-c_enc/b_enc)*100.0
          dec_delta=(c_dec/b_dec-1.0)*100.0

          print("AURORA_MEDIA_EXP40_EXACT_AB")
          print("BITSTREAM_IDENTITY=PASS")
          print(
              "encode",
              f"exp37_ms={b_enc:.6f}",
              f"exp40_ms={c_enc:.6f}",
              f"speedup_x={speed:.3f}",
              f"time_reduction_pct={enc_reduction:.2f}",
          )
          print(
              "decode",
              f"exp37_ms={b_dec:.6f}",
              f"exp40_ms={c_dec:.6f}",
              f"delta_pct={dec_delta:.2f}",
          )
          candidate=(c_enc <= b_enc*0.95 and c_dec <= b_dec*1.03)
          print("EXP40_MEDIA_CANDIDATE",str(candidate).lower())
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: aurora-media-exp40-exact-cache
          path: |
            exp40_backend_ab.txt
            exp40_backend_summary.txt
